<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Lister</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Space Grotesk", "Segoe UI", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen bg-[hsl(37_39%_87%)] text-[hsl(30_13%_10%)] pb-[calc(4rem_+_5vh)] transition-colors duration-200 dark:bg-[hsl(220_18%_12%)] dark:text-[hsl(43_33%_92%)]">
    <main class="min-h-screen w-full">
        <div class="min-h-screen">
            <aside id="filtersAside" class="sticky top-8 z-20 mx-4 mt-4 mb-4 rounded-xl border border-[hsl(34_33%_84%)] bg-[hsl(0_0%_100%/0.72)] px-3 pb-3 pt-3 shadow-[0_4px_10px_hsl(32_58%_13%/0.12)] backdrop-blur-md transition-all duration-500 ease-in-out dark:border-[hsl(220_16%_27%)] dark:bg-[hsl(222_20%_16%/0.85)] dark:shadow-[0_4px_14px_hsl(220_45%_5%/0.45)] md:mx-8 md:mt-8 md:mb-8 md:px-5 md:pb-5 md:pt-4" aria-label="Filters">
                <section class="flex flex-wrap items-end justify-center gap-4">
                    <div id="filtersControlsGroup" class="flex w-full min-w-0 flex-wrap items-end gap-3 lg:w-auto lg:flex-none lg:min-w-0 lg:flex-nowrap">
                        <div id="searchControl" class="flex w-full flex-col gap-1.5 lg:w-[22rem]">
                            <label for="searchInput" class="text-sm text-[hsl(28_10%_39%)] dark:text-[hsl(38_18%_72%)]">Search title, actor, director</label>
                            <input id="searchInput" type="text" placeholder="Try: hemsworth, ambulance, nicolai" class="w-full rounded-lg border border-[hsl(34_33%_84%)] bg-[hsl(0_0%_100%)] px-3 py-2.5 text-sm text-[hsl(30_13%_10%)] outline-none ring-0 transition focus:border-[hsl(174_77%_26%)] focus:ring-2 focus:ring-[hsl(174_77%_26%/0.33)] dark:border-[hsl(220_16%_31%)] dark:bg-[hsl(220_16%_20%)] dark:text-[hsl(45_35%_93%)] dark:placeholder:text-[hsl(38_12%_63%)] dark:focus:border-[hsl(168_78%_42%)] dark:focus:ring-[hsl(168_78%_42%/0.33)]" />
                        </div>

                        <div id="genreControl" class="flex w-full flex-col gap-1.5 sm:w-[calc(50%-0.375rem)] lg:w-48 xl:w-56">
                            <label for="genreSelect" class="text-sm text-[hsl(28_10%_39%)] dark:text-[hsl(38_18%_72%)]">Genre</label>
                            <select id="genreSelect" class="w-full rounded-lg border border-[hsl(34_33%_84%)] bg-[hsl(0_0%_100%)] px-3 py-2.5 text-sm text-[hsl(30_13%_10%)] outline-none ring-0 transition focus:border-[hsl(174_77%_26%)] focus:ring-2 focus:ring-[hsl(174_77%_26%/0.33)] dark:border-[hsl(220_16%_31%)] dark:bg-[hsl(220_16%_20%)] dark:text-[hsl(45_35%_93%)] dark:focus:border-[hsl(168_78%_42%)] dark:focus:ring-[hsl(168_78%_42%/0.33)]">
                                <option value="">All genres</option>
                            </select>
                        </div>

                        <div id="yearControl" class="flex w-full flex-col gap-1.5 sm:w-[calc(50%-0.375rem)] lg:w-32 xl:w-40">
                            <label for="yearSelect" class="text-sm text-[hsl(28_10%_39%)] dark:text-[hsl(38_18%_72%)]">Year</label>
                            <select id="yearSelect" class="w-full rounded-lg border border-[hsl(34_33%_84%)] bg-[hsl(0_0%_100%)] px-3 py-2.5 text-sm text-[hsl(30_13%_10%)] outline-none ring-0 transition focus:border-[hsl(174_77%_26%)] focus:ring-2 focus:ring-[hsl(174_77%_26%/0.33)] dark:border-[hsl(220_16%_31%)] dark:bg-[hsl(220_16%_20%)] dark:text-[hsl(45_35%_93%)] dark:focus:border-[hsl(168_78%_42%)] dark:focus:ring-[hsl(168_78%_42%/0.33)]">
                                <option value="">All years</option>
                            </select>
                        </div>

                        <div id="sortControl" class="flex w-full flex-col gap-1.5 sm:w-[calc(50%-0.375rem)] lg:w-48 xl:w-56">
                            <label for="sortSelect" class="text-sm text-[hsl(28_10%_39%)] dark:text-[hsl(38_18%_72%)]">Sort</label>
                            <select id="sortSelect" class="w-full rounded-lg border border-[hsl(34_33%_84%)] bg-[hsl(0_0%_100%)] px-3 py-2.5 text-sm text-[hsl(30_13%_10%)] outline-none ring-0 transition focus:border-[hsl(174_77%_26%)] focus:ring-2 focus:ring-[hsl(174_77%_26%/0.33)] dark:border-[hsl(220_16%_31%)] dark:bg-[hsl(220_16%_20%)] dark:text-[hsl(45_35%_93%)] dark:focus:border-[hsl(168_78%_42%)] dark:focus:ring-[hsl(168_78%_42%/0.33)]">
                                <option value="title-asc">Title A-Z</option>
                                <option value="title-desc">Title Z-A</option>
                                <option value="year-desc">Year Newest</option>
                                <option value="year-asc">Year Oldest</option>
                                <option value="rating-desc">IMDb Rating High-Low</option>
                                <option value="rating-asc">IMDb Rating Low-High</option>
                            </select>
                        </div>

                        <div id="countControl" class="flex w-[90px] items-end mb-2 ml-4 opacity-50">
                            <span id="resultsCount">0 Titles</span>
                        </div>
                    </div>

                    <div class="hidden lg:block lg:w-px lg:self-stretch lg:bg-[linear-gradient(to_bottom,transparent_0%,hsl(34_33%_78%)_16%,hsl(34_33%_78%)_84%,transparent_100%)] dark:lg:bg-[linear-gradient(to_bottom,transparent_0%,hsl(220_15%_35%)_16%,hsl(220_15%_35%)_84%,transparent_100%)] mx-4 opacity-75"></div>

                    <div class="flex w-full flex-wrap items-end gap-3 lg:w-auto lg:flex-none lg:ml-4">
                        <div class="flex w-full flex-col gap-1.5 sm:w-[calc(50%-0.375rem)] xl:w-auto">
                            <label for="themeToggle" class="text-sm text-[hsl(28_10%_39%)] dark:text-[hsl(38_18%_72%)]">Mode</label>
                            <button id="themeToggle" type="button" class="inline-flex h-[42px] w-[70px] items-center justify-center rounded-lg border border-[hsl(34_33%_84%)] bg-[hsl(0_0%_100%)] px-4 text-sm font-medium text-[hsl(30_13%_10%)] transition hover:bg-[hsl(36_33%_94%)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[hsl(174_77%_26%/0.33)] focus-visible:ring-offset-2 focus-visible:ring-offset-[hsl(0_0%_100%)] dark:border-[hsl(220_16%_31%)] dark:bg-[hsl(220_16%_20%)] dark:text-[hsl(45_35%_93%)] dark:hover:bg-[hsl(220_14%_26%)] dark:focus-visible:ring-[hsl(168_78%_42%/0.35)] dark:focus-visible:ring-offset-[hsl(222_20%_16%)]" aria-label="Switch color theme" aria-pressed="false">Dark</button>
                        </div>

                        <div class="flex w-full flex-col gap-1.5 sm:w-[calc(50%-0.375rem)] xl:w-auto">
                            <label for="widthToggle" class="text-sm text-[hsl(28_10%_39%)] dark:text-[hsl(38_18%_72%)]">Width</label>
                            <button id="widthToggle" type="button" class="inline-flex h-[42px] w-[90px] items-center justify-center rounded-lg border border-[hsl(34_33%_84%)] bg-[hsl(0_0%_100%)] px-4 text-sm font-medium text-[hsl(30_13%_10%)] transition hover:bg-[hsl(36_33%_94%)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[hsl(174_77%_26%/0.33)] focus-visible:ring-offset-2 focus-visible:ring-offset-[hsl(0_0%_100%)] dark:border-[hsl(220_16%_31%)] dark:bg-[hsl(220_16%_20%)] dark:text-[hsl(45_35%_93%)] dark:hover:bg-[hsl(220_14%_26%)] dark:focus-visible:ring-[hsl(168_78%_42%/0.35)] dark:focus-visible:ring-offset-[hsl(222_20%_16%)]" aria-label="Switch grid width" aria-pressed="false">Boxed</button>
                        </div>
                    </div>
                </section>
            </aside>

            <section>
                <section id="grid" class="grid grid-cols-2 gap-6 p-6 sm:gap-7 sm:p-7 md:gap-8 md:p-8 md:grid-cols-[repeat(auto-fill,minmax(max(300px,calc((100%_-_14rem)/8)),1fr))]" aria-label="Movie cards"></section>
                <div id="emptyState" class="px-4 py-10 text-center text-sm text-[hsl(28_10%_39%)] dark:text-[hsl(38_14%_72%)]" hidden>No movies match the current filters.</div>
            </section>
        </div>
    </main>

    <script>
        const state = {
            movies: [],
            filtered: [],
        };

        const refs = {
            searchInput: document.getElementById("searchInput"),
            genreSelect: document.getElementById("genreSelect"),
            yearSelect: document.getElementById("yearSelect"),
            sortSelect: document.getElementById("sortSelect"),
            themeToggle: document.getElementById("themeToggle"),
            widthToggle: document.getElementById("widthToggle"),
            filtersControlsGroup: document.getElementById("filtersControlsGroup"),
            searchControl: document.getElementById("searchControl"),
            genreControl: document.getElementById("genreControl"),
            yearControl: document.getElementById("yearControl"),
            sortControl: document.getElementById("sortControl"),
            countControl: document.getElementById("countControl"),
            resultsCount: document.getElementById("resultsCount"),
            filtersAside: document.getElementById("filtersAside"),
            grid: document.getElementById("grid"),
            emptyState: document.getElementById("emptyState"),
        };

        function updateResultsCount() {
            refs.resultsCount.textContent = `${state.filtered.length} Titles`;
        }

        const themeState = {
            mode: "system",
            media: window.matchMedia("(prefers-color-scheme: dark)"),
        };

        const widthState = {
            mode: "boxed",
        };

        const WIDTH_TOGGLE_MIN_VIEWPORT = 1400;

        const layoutState = {
            filtersResizeObserver: null,
            lastScrollY: window.scrollY,
        };

        function getSystemMode() {
            return themeState.media.matches ? "dark" : "light";
        }

        function getPreferredMode() {
            const saved = localStorage.getItem("theme-mode");
            if (saved === "dark" || saved === "light") {
                return saved;
            }
            return "system";
        }

        function applyTheme(mode) {
            const resolved = mode === "system" ? getSystemMode() : mode;
            document.documentElement.classList.toggle("dark", resolved === "dark");
            themeState.mode = mode;
            updateThemeToggleLabel();
            updateFiltersShadow();
        }

        function updateThemeToggleLabel() {
            const current = document.documentElement.classList.contains("dark") ? "dark" : "light";
            const currentLabel = current === "dark" ? "Dark" : "Light";
            refs.themeToggle.textContent = currentLabel;
            refs.themeToggle.setAttribute("aria-pressed", String(current === "dark"));
        }

        function wireTheme() {
            applyTheme(getPreferredMode());

            refs.themeToggle.addEventListener("click", () => {
                const current = document.documentElement.classList.contains("dark") ? "dark" : "light";
                const next = current === "dark" ? "light" : "dark";
                localStorage.setItem("theme-mode", next);
                applyTheme(next);
            });

            themeState.media.addEventListener("change", () => {
                if (themeState.mode === "system") {
                    applyTheme("system");
                }
            });
        }

        function getPreferredGridWidthMode() {
            const saved = localStorage.getItem("grid-width-mode");
            if (saved === "boxed" || saved === "full") {
                return saved;
            }
            return "boxed";
        }

        function getEffectiveGridWidthMode() {
            return window.innerWidth >= WIDTH_TOGGLE_MIN_VIEWPORT ? widthState.mode : "full";
        }

        function updateFiltersControlsLayout() {
            const asideWidth = refs.filtersAside.clientWidth;
            const effectiveMode = getEffectiveGridWidthMode();
            const rowThreshold = effectiveMode === "boxed" ? 1080 : 1240;
            const isColumn = asideWidth < rowThreshold;

            // Keep filters in one of two explicit layouts only: row or column.
            refs.filtersControlsGroup.style.flexDirection = isColumn ? "column" : "row";
            refs.filtersControlsGroup.style.flexWrap = "nowrap";
            refs.filtersControlsGroup.style.alignItems = isColumn ? "stretch" : "flex-end";

            refs.searchControl.style.width = isColumn ? "100%" : "22rem";
            refs.genreControl.style.width = isColumn ? "100%" : "12rem";
            refs.yearControl.style.width = isColumn ? "100%" : "8rem";
            refs.sortControl.style.width = isColumn ? "100%" : "12rem";
            refs.countControl.style.width = isColumn ? "100%" : "90px";
            refs.countControl.style.marginLeft = isColumn ? "0" : "1rem";
            refs.countControl.style.marginBottom = isColumn ? "0" : "0.5rem";
        }

        function updateFiltersShadow() {
            const isAtTop = window.scrollY <= 8;
            const isDark = document.documentElement.classList.contains("dark");

            if (isDark) {
                refs.filtersAside.style.boxShadow = isAtTop
                    ? "0 1px 4px hsl(220 45% 5% / 0.18)"
                    : "0 10px 26px hsl(220 45% 5% / 0.58)";
                return;
            }

            refs.filtersAside.style.boxShadow = isAtTop
                ? "0 1px 4px hsl(32 58% 13% / 0.08)"
                : "0 10px 24px hsl(32 58% 13% / 0.2)";
        }

        function updateFiltersScrollVisibility(forceShow = false) {
            const isStickyEnabled = window.innerWidth >= WIDTH_TOGGLE_MIN_VIEWPORT;
            const currentScrollY = window.scrollY;

            if (!isStickyEnabled || forceShow) {
                refs.filtersAside.style.transform = "translateY(0)";
                refs.filtersAside.style.opacity = "1";
                refs.filtersAside.style.pointerEvents = "auto";
                updateFiltersShadow();
                layoutState.lastScrollY = currentScrollY;
                return;
            }

            if (currentScrollY <= 8) {
                refs.filtersAside.style.transform = "translateY(0)";
                refs.filtersAside.style.opacity = "1";
                refs.filtersAside.style.pointerEvents = "auto";
                updateFiltersShadow();
                layoutState.lastScrollY = currentScrollY;
                return;
            }

            const scrollingDown = currentScrollY > layoutState.lastScrollY + 14;
            const scrollingUp = currentScrollY < layoutState.lastScrollY - 14;

            if (scrollingDown && currentScrollY > 180) {
                refs.filtersAside.style.transform = "translateY(calc(-100% - 1rem))";
                refs.filtersAside.style.opacity = "0";
                refs.filtersAside.style.pointerEvents = "none";
            } else if (scrollingUp) {
                refs.filtersAside.style.transform = "translateY(0)";
                refs.filtersAside.style.opacity = "1";
                refs.filtersAside.style.pointerEvents = "auto";
            }

            updateFiltersShadow();

            layoutState.lastScrollY = currentScrollY;
        }

        function applyGridWidth(mode) {
            widthState.mode = mode;
            const effectiveMode = getEffectiveGridWidthMode();
            const isStickyEnabled = window.innerWidth >= WIDTH_TOGGLE_MIN_VIEWPORT;
            const fullModeInlineMargin = window.innerWidth < 640 ? "1rem" : "2rem";
            const gridStyles = window.getComputedStyle(refs.grid);
            const gridPadX = Number.parseFloat(gridStyles.paddingLeft || "0") + Number.parseFloat(gridStyles.paddingRight || "0");

            refs.grid.style.maxWidth = effectiveMode === "boxed" ? "75vw" : "none";
            refs.grid.style.marginInline = "auto";
            refs.filtersAside.style.maxWidth = effectiveMode === "boxed" ? `calc(75vw - ${gridPadX}px)` : "none";
            refs.filtersAside.style.marginInline = effectiveMode === "boxed" ? "auto" : fullModeInlineMargin;
            refs.filtersAside.style.position = isStickyEnabled ? "sticky" : "static";
            refs.filtersAside.style.top = isStickyEnabled ? "2rem" : "auto";
            updateFiltersControlsLayout();
            updateFiltersScrollVisibility(true);

            updateWidthToggleLabel();
        }

        function updateWidthToggleLabel() {
            const effectiveMode = getEffectiveGridWidthMode();
            const currentLabel = effectiveMode === "full" ? "Full" : "Boxed";
            const isLockedToFull = window.innerWidth < WIDTH_TOGGLE_MIN_VIEWPORT;

            refs.widthToggle.textContent = currentLabel;
            refs.widthToggle.setAttribute("aria-pressed", String(effectiveMode === "full"));
            refs.widthToggle.disabled = isLockedToFull;
            refs.widthToggle.setAttribute("aria-disabled", String(isLockedToFull));
        }

        function wireGridWidthToggle() {
            applyGridWidth(getPreferredGridWidthMode());

            if (layoutState.filtersResizeObserver) {
                layoutState.filtersResizeObserver.disconnect();
            }

            layoutState.filtersResizeObserver = new ResizeObserver(() => {
                updateFiltersControlsLayout();
            });
            layoutState.filtersResizeObserver.observe(refs.filtersAside);

            window.addEventListener("resize", () => {
                applyGridWidth(widthState.mode);
            });

            window.addEventListener("scroll", () => {
                updateFiltersScrollVisibility();
            });

            refs.widthToggle.addEventListener("click", () => {
                const next = widthState.mode === "full" ? "boxed" : "full";
                localStorage.setItem("grid-width-mode", next);
                applyGridWidth(next);
            });
        }

        function normalize(value) {
            return String(value || "").trim().toLowerCase();
        }

        function parseNumber(value) {
            const n = Number.parseFloat(value);
            return Number.isFinite(n) ? n : NaN;
        }

        function posterPath(movie) {
            const imdbID = movie.imdbID || "";
            return `posters/${imdbID}.jpg`;
        }

        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function truncateText(value, maxLength) {
            const text = String(value || "").trim();
            if (text.length <= maxLength) {
                return text;
            }

            return `${text.slice(0, maxLength).trimEnd()}...`;
        }

        function ratingToneClass(imdbRating) {
            const rating = Number.parseFloat(imdbRating);
            if (!Number.isFinite(rating)) {
                return "text-[hsl(28_10%_39%)] dark:text-[hsl(38_14%_70%)]";
            }

            if (rating >= 7.5) {
                return "text-[hsl(142_65%_32%)] dark:text-[hsl(145_68%_62%)]";
            }

            if (rating >= 6) {
                return "text-[hsl(38_78%_44%)] dark:text-[hsl(43_90%_64%)]";
            }

            if (rating >= 4.5) {
                return "text-[hsl(27_78%_45%)] dark:text-[hsl(26_84%_62%)]";
            }

            return "text-[hsl(4_72%_45%)] dark:text-[hsl(4_82%_62%)]";
        }

        function posterFallbackDataUri() {
            const svg =
                '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600">' +
                '<rect width="100%" height="100%" fill="hsl(36 41% 87%)"/>' +
                '<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="28" fill="hsl(28 12% 39%)">No Poster</text>' +
                '</svg>';
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        function handlePosterError(img) {
            const imdbID = img.dataset.imdb || "";
            const posterUrl = img.dataset.posterUrl || "";
            const step = Number(img.dataset.step || "0");

            if (!imdbID) {
                img.src = posterFallbackDataUri();
                return;
            }

            const localCandidates = [
                `posters/${imdbID}.jpg`,
                `posters/${imdbID}.png`,
                `posters/${imdbID}.webp`,
            ];

            if (step < localCandidates.length - 1) {
                const nextStep = step + 1;
                img.dataset.step = String(nextStep);
                img.src = localCandidates[nextStep];
                return;
            }

            if (step === localCandidates.length - 1 && posterUrl && posterUrl !== "N/A") {
                img.dataset.step = String(localCandidates.length);
                img.src = posterUrl;
                return;
            }

            img.onerror = null;
            img.src = posterFallbackDataUri();
        }

        function fillFilterOptions(movies) {
            const genres = new Set();
            const years = new Set();

            for (const movie of movies) {
                String(movie.Genre || "")
                    .split(",")
                    .map((g) => g.trim())
                    .filter(Boolean)
                    .forEach((g) => genres.add(g));

                if (movie.Year && movie.Year !== "N/A") {
                    years.add(String(movie.Year));
                }
            }

            const sortedGenres = [...genres].sort((a, b) => a.localeCompare(b));
            const sortedYears = [...years].sort((a, b) => Number(b) - Number(a));

            refs.genreSelect.innerHTML =
                '<option value="">All genres</option>' +
                sortedGenres.map((genre) => `<option value="${genre}">${genre}</option>`).join("");

            refs.yearSelect.innerHTML =
                '<option value="">All years</option>' +
                sortedYears.map((year) => `<option value="${year}">${year}</option>`).join("");
        }

        function applyFilters() {
            const query = normalize(refs.searchInput.value);
            const genre = refs.genreSelect.value;
            const year = refs.yearSelect.value;
            const sort = refs.sortSelect.value;

            let result = state.movies.filter((movie) => {
                const haystack = [movie.Title, movie.Actors, movie.Director, movie.Plot, movie.Genre]
                    .map(normalize)
                    .join(" ");

                const matchesQuery = !query || haystack.includes(query);
                const matchesGenre = !genre || String(movie.Genre || "").split(",").map((g) => g.trim()).includes(genre);
                const matchesYear = !year || String(movie.Year) === year;

                return matchesQuery && matchesGenre && matchesYear;
            });

            result = result.sort((a, b) => {
                if (sort === "title-asc") {
                    return String(a.Title || "").localeCompare(String(b.Title || ""));
                }
                if (sort === "title-desc") {
                    return String(b.Title || "").localeCompare(String(a.Title || ""));
                }
                if (sort === "year-desc") {
                    return Number(b.Year || 0) - Number(a.Year || 0);
                }
                if (sort === "year-asc") {
                    return Number(a.Year || 0) - Number(b.Year || 0);
                }
                if (sort === "rating-desc") {
                    return parseNumber(b.imdbRating) - parseNumber(a.imdbRating);
                }
                if (sort === "rating-asc") {
                    return parseNumber(a.imdbRating) - parseNumber(b.imdbRating);
                }
                return 0;
            });

            state.filtered = result;
            render();
        }

        function cardTemplate(movie) {
            const genres = String(movie.Genre || "")
                .split(",")
                .map((g) => g.trim())
                .filter(Boolean)
                .slice(0, 3)
                .map((g) => `<span class="rounded-full border border-[hsl(32_31%_78%)] bg-[hsl(35_53%_93%)] px-2.5 py-1 text-xs text-[hsl(29_17%_26%)] dark:border-[hsl(220_16%_33%)] dark:bg-[hsl(220_17%_23%)] dark:text-[hsl(40_30%_86%)]">${escapeHtml(g)}</span>`)
                .join("");

            const rating = movie.imdbRating && movie.imdbRating !== "N/A" ? movie.imdbRating : "-";
            const runtime = movie.Runtime && movie.Runtime !== "N/A" ? movie.Runtime : "Unknown runtime";
            const year = movie.Year || "Unknown year";
            const title = escapeHtml(movie.Title || "Untitled");
            const fullPlot = escapeHtml(movie.Plot || "No plot available.");
            const plot = escapeHtml(truncateText(movie.Plot || "No plot available.", 95));
            const ratingTone = ratingToneClass(movie.imdbRating);
            const actorPills = String(movie.Actors || "")
                .split(",")
                .map((a) => a.trim())
                .filter(Boolean)
                .slice(0, 3)
                .map((a) => `<span class="shrink-0 rounded-full border border-[hsl(188_33%_74%)] bg-[hsl(189_54%_92%)] px-2.5 py-1 text-xs text-[hsl(191_37%_27%)] dark:border-[hsl(191_25%_34%)] dark:bg-[hsl(192_34%_24%)] dark:text-[hsl(187_39%_82%)]">${escapeHtml(a)}</span>`)
                .join("") || '<span class="text-[0.9rem] text-[hsl(28_10%_39%)] dark:text-[hsl(38_14%_70%)]">Actors unavailable</span>';
            const imdb = escapeHtml(movie.imdbID || "");
            const imdbIdRaw = String(movie.imdbID || "").trim();
            const imdbUrl = /^tt\d+$/.test(imdbIdRaw) ? `https://www.imdb.com/title/${imdbIdRaw}/` : "";
            const remotePoster = escapeHtml(movie.Poster || "");

            return `
                <article class="group flex min-h-full flex-col overflow-hidden rounded-xl border border-[hsl(32_32%_75%)] shadow-[0_8px_20px_hsl(32_58%_13%/0.12)] transition duration-150 transform-gpu hover:scale-[1.01] hover:shadow-[0_14px_28px_hsl(32_58%_13%/0.22)] dark:border-[hsl(220_15%_27%)] dark:shadow-[0_8px_24px_hsl(220_45%_5%/0.5)] dark:hover:shadow-[0_14px_30px_hsl(220_48%_3%/0.72)]">
                    <img class="aspect-[2/3] w-full object-cover bg-[hsl(37_43%_90%)] dark:bg-[hsl(220_15%_20%)]" loading="lazy" src="${posterPath(movie)}" alt="${title} poster" data-imdb="${imdb}" data-poster-url="${remotePoster}" data-step="0" onerror="handlePosterError(this)" />
                    <div class="flex flex-1 flex-col gap-3 bg-[hsl(40_100%_99%/0.68)] p-4 transition-colors duration-150 group-hover:bg-[hsl(40_100%_99%/0.96)] dark:bg-[hsl(220_14%_17%/0.9)] dark:group-hover:bg-[hsl(220_14%_21%/0.95)]">
                        <h2 class="m-0 text-[1.2rem] font-medium leading-6 text-[hsl(24_17%_10%)] dark:text-[hsl(43_33%_92%)]">${imdbUrl ? `<a href="${imdbUrl}" target="_blank" rel="noopener noreferrer" class="text-[hsl(208_72%_36%)] transition hover:text-[hsl(208_78%_30%)] hover:underline hover:underline-offset-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[hsl(208_72%_36%/0.35)] focus-visible:ring-offset-2 focus-visible:ring-offset-[hsl(40_100%_99%)] dark:text-[hsl(198_84%_71%)] dark:hover:text-[hsl(198_92%_80%)] dark:focus-visible:ring-[hsl(198_84%_71%/0.35)] dark:focus-visible:ring-offset-[hsl(220_14%_18%)]">${title}</a>` : title}</h2>
                        <div class="flex flex-wrap items-center gap-x-3 gap-y-2 text-[0.95rem] leading-7 text-[hsl(29_13%_31%)] dark:text-[hsl(38_14%_74%)]">
                            <span>${escapeHtml(year)}</span>
                            <span aria-hidden="true">&middot;</span>
                            <span>${escapeHtml(runtime)}</span>
                            <span aria-hidden="true">&middot;</span>
                            <span class="font-medium ${ratingTone}">IMDb ${escapeHtml(rating)}</span>
                        </div>
                        <div class="flex items-center gap-2" title="${escapeHtml(movie.Actors || "Actors unavailable")}">
                            <span class="shrink-0 text-[0.9rem] text-[hsl(29_13%_31%)] dark:text-[hsl(38_14%_74%)]">Stars:</span>
                            <div class="no-scrollbar flex min-w-0 flex-1 flex-nowrap items-center gap-2 overflow-x-auto whitespace-nowrap" style="-ms-overflow-style:none;scrollbar-width:none;">${actorPills}</div>
                        </div>
                        <div class="flex flex-wrap gap-2">${genres}</div>
                        <p class="m-0 text-[0.95rem] leading-[1.45] text-[hsl(30_14%_24%)] dark:text-[hsl(40_16%_82%)]" title="${fullPlot}" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">${plot}</p>
                    </div>
                </article>
            `;
        }

        function render() {
            updateResultsCount();

            if (!state.filtered.length) {
                refs.grid.innerHTML = "";
                refs.emptyState.hidden = false;
                return;
            }

            refs.emptyState.hidden = true;
            refs.grid.innerHTML = state.filtered.map(cardTemplate).join("");
        }

        async function loadMovies() {
            const response = await fetch("movies.json", { cache: "no-store" });
            if (!response.ok) {
                throw new Error(`Failed to load movies.json: ${response.status}`);
            }

            const movies = await response.json();
            if (!Array.isArray(movies)) {
                throw new Error("movies.json must contain an array");
            }

            state.movies = movies;
            fillFilterOptions(movies);
            applyFilters();
        }

        function wireEvents() {
            refs.searchInput.addEventListener("input", applyFilters);
            refs.genreSelect.addEventListener("change", applyFilters);
            refs.yearSelect.addEventListener("change", applyFilters);
            refs.sortSelect.addEventListener("change", applyFilters);
        }

        async function init() {
            wireTheme();
            wireGridWidthToggle();
            wireEvents();
            try {
                await loadMovies();
            } catch (error) {
                refs.emptyState.hidden = false;
                refs.emptyState.textContent = error.message;
            }
        }

        init();
    </script>
</body>
</html>
