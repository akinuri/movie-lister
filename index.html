                        <div id="letterControl" class="relative flex w-full flex-col gap-1.5 sm:w-[calc(50%-0.375rem)] lg:w-20 xl:w-32">

                                <span id="letterToggleLabel" class="truncate">All</span>

                                <div class="mb-2 flex items-center justify-end">

                        <div id="genreControl" class="relative flex w-full flex-col gap-1.5 sm:w-[calc(50%-0.375rem)] lg:w-48 xl:w-56">

                            <button id="genreToggle" type="button" class="inline-flex h-[42px] w-full items-center justify-between rounded-lg border border-[hsl(34_33%_84%)] bg-[hsl(0_0%_100%)] px-3 text-sm text-[hsl(30_13%_10%)] outline-none ring-0 transition hover:bg-[hsl(36_33%_94%)] focus:border-[hsl(174_77%_26%)] focus:ring-2 focus:ring-[hsl(174_77%_26%/0.33)] dark:border-[hsl(220_16%_31%)] dark:bg-[hsl(220_16%_20%)] dark:text-[hsl(45_35%_93%)] dark:hover:bg-[hsl(220_14%_26%)] dark:focus:border-[hsl(168_78%_42%)] dark:focus:ring-[hsl(168_78%_42%/0.33)]" aria-label="Select genres" aria-expanded="false">
                                <span id="genreToggleLabel" class="truncate">All</span>

                            <div id="genrePanel" class="hidden absolute left-0 right-0 top-[calc(100%+0.4rem)] z-30 rounded-lg border border-[hsl(34_33%_84%)] bg-[hsl(40_100%_99%/0.98)] p-2 shadow-[0_14px_24px_hsl(32_58%_13%/0.16)] backdrop-blur-md dark:border-[hsl(220_16%_31%)] dark:bg-[hsl(220_16%_18%/0.98)] dark:shadow-[0_14px_24px_hsl(220_45%_5%/0.56)]">
                                <div class="mb-2 flex items-center justify-end">

                        <div id="yearControl" class="relative flex w-full flex-col gap-1.5 sm:w-[calc(50%-0.375rem)] lg:w-32 xl:w-40">

                            <button id="yearToggle" type="button" class="inline-flex h-[42px] w-full items-center justify-between rounded-lg border border-[hsl(34_33%_84%)] bg-[hsl(0_0%_100%)] px-3 text-sm text-[hsl(30_13%_10%)] outline-none ring-0 transition hover:bg-[hsl(36_33%_94%)] focus:border-[hsl(174_77%_26%)] focus:ring-2 focus:ring-[hsl(174_77%_26%/0.33)] dark:border-[hsl(220_16%_31%)] dark:bg-[hsl(220_16%_20%)] dark:text-[hsl(45_35%_93%)] dark:hover:bg-[hsl(220_14%_26%)] dark:focus:border-[hsl(168_78%_42%)] dark:focus:ring-[hsl(168_78%_42%/0.33)]" aria-label="Select years" aria-expanded="false">

                                <div class="mb-2 flex items-center justify-end">
                                    <button id="yearClear" type="button" class="rounded-md px-2 py-1 text-xs text-[hsl(28_22%_30%)] transition hover:bg-[hsl(35_41%_92%)] dark:text-[hsl(38_21%_78%)] dark:hover:bg-[hsl(220_14%_24%)]">Clear</button>
                                </div>
                                <div id="yearOptions" class="max-h-56 space-y-1 overflow-y-auto pr-1"></div>
                            </div>
                        </div>

                        <div id="sortControl" class="flex w-full flex-col gap-1.5 sm:w-[calc(50%-0.375rem)] lg:w-48 xl:w-56">
                            <label for="sortSelect" class="text-sm text-[hsl(28_10%_39%)] dark:text-[hsl(38_18%_72%)]">Sort</label>
                            <select id="sortSelect" class="w-full rounded-lg border border-[hsl(34_33%_84%)] bg-[hsl(0_0%_100%)] px-3 py-2.5 text-sm text-[hsl(30_13%_10%)] outline-none ring-0 transition focus:border-[hsl(174_77%_26%)] focus:ring-2 focus:ring-[hsl(174_77%_26%/0.33)] dark:border-[hsl(220_16%_31%)] dark:bg-[hsl(220_16%_20%)] dark:text-[hsl(45_35%_93%)] dark:focus:border-[hsl(168_78%_42%)] dark:focus:ring-[hsl(168_78%_42%/0.33)]">
                                <option value="title-asc">Title A-Z</option>
                                <option value="title-desc">Title Z-A</option>

                                <option value="rating-asc">Rating 0-9</option>

                        <!-- Insert: Ignore leading articles checkbox -->
                        <div id="articlesControl" class="flex w-full flex-col gap-1.5 sm:w-[calc(50%-0.375rem)] lg:w-28">

                            <div class="flex h-11 items-center -mt-1">
                                <input type="checkbox" id="ignoreArticlesCheckbox" class="cursor-pointer accent-[hsl(30_13%_50%)] dark:accent-[hsl(43_33%_82%)]" />

                        <div id="countControl" class="flex w-[90px] items-end mb-3 ml-4 opacity-50">

                    </div>

                    <div class="hidden lg:block lg:w-px lg:self-stretch lg:bg-[linear-gradient(to_bottom,transparent_0%,hsl(34_33%_78%)_16%,hsl(34_33%_78%)_84%,transparent_100%)] dark:lg:bg-[linear-gradient(to_bottom,transparent_0%,hsl(220_15%_35%)_16%,hsl(220_15%_35%)_84%,transparent_100%)] mx-4 opacity-75"></div>

                    <div class="flex w-full flex-wrap items-end gap-3 lg:w-auto lg:flex-none lg:ml-4">
                    
                        <div id="infoToggleControl" class="flex w-full flex-col gap-1.5 sm:w-[calc(50%-0.375rem)] xl:w-auto mt-2 lg:ml-4">
                            <label for="infoToggle" class="text-sm text-[hsl(28_10%_39%)] dark:text-[hsl(38_18%_72%)]">Info</label>
                            <button id="infoToggle" type="button" class="inline-flex h-[42px] w-[50px] items-center justify-center rounded-lg border border-[hsl(34_33%_84%)] bg-[hsl(0_0%_100%)] px-4 text-sm text-[hsl(30_13%_10%)] transition hover:bg-[hsl(36_33%_94%)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[hsl(174_77%_26%/0.33)] focus-visible:ring-offset-2 focus-visible:ring-offset-[hsl(0_0%_100%)] dark:border-[hsl(220_16%_31%)] dark:bg-[hsl(220_16%_20%)] dark:text-[hsl(45_35%_93%)] dark:hover:bg-[hsl(220_14%_26%)] dark:focus-visible:ring-[hsl(168_78%_42%/0.35)] dark:focus-visible:ring-offset-[hsl(222_20%_16%)]" aria-label="Show/hide all info" aria-pressed="false">Off</button>
                        </div>
                        
                        <div class="flex w-full flex-col gap-1.5 sm:w-[calc(50%-0.375rem)] xl:w-auto">
                            <label for="themeToggle" class="text-sm text-[hsl(28_10%_39%)] dark:text-[hsl(38_18%_72%)]">Mode</label>
                            <button id="themeToggle" type="button" class="inline-flex h-[42px] w-[70px] items-center justify-center rounded-lg border border-[hsl(34_33%_84%)] bg-[hsl(0_0%_100%)] px-4 text-sm text-[hsl(30_13%_10%)] transition hover:bg-[hsl(36_33%_94%)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[hsl(174_77%_26%/0.33)] focus-visible:ring-offset-2 focus-visible:ring-offset-[hsl(0_0%_100%)] dark:border-[hsl(220_16%_31%)] dark:bg-[hsl(220_16%_20%)] dark:text-[hsl(45_35%_93%)] dark:hover:bg-[hsl(220_14%_26%)] dark:focus-visible:ring-[hsl(168_78%_42%/0.35)] dark:focus-visible:ring-offset-[hsl(222_20%_16%)]" aria-label="Switch color theme" aria-pressed="false">Dark</button>
                        </div>

                        <div class="flex w-full flex-col gap-1.5 sm:w-[calc(50%-0.375rem)] xl:w-auto">
                            <label for="widthToggle" class="text-sm text-[hsl(28_10%_39%)] dark:text-[hsl(38_18%_72%)]">Width</label>
                            <button id="widthToggle" type="button" class="inline-flex h-[42px] w-[70px] items-center justify-center rounded-lg border border-[hsl(34_33%_84%)] bg-[hsl(0_0%_100%)] px-4 text-sm text-[hsl(30_13%_10%)] transition hover:bg-[hsl(36_33%_94%)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[hsl(174_77%_26%/0.33)] focus-visible:ring-offset-2 focus-visible:ring-offset-[hsl(0_0%_100%)] dark:border-[hsl(220_16%_31%)] dark:bg-[hsl(220_16%_20%)] dark:text-[hsl(45_35%_93%)] dark:hover:bg-[hsl(220_14%_26%)] dark:focus-visible:ring-[hsl(168_78%_42%/0.35)] dark:focus-visible:ring-offset-[hsl(222_20%_16%)]" aria-label="Switch grid width" aria-pressed="false">Boxed</button>
                        </div>
                    </div>
                </section>
            </aside>

            <section>
                <section id="grid" class="grid grid-cols-2 gap-6 p-6 sm:gap-7 sm:p-7 md:gap-8 md:p-8 md:grid-cols-[repeat(auto-fill,minmax(max(300px,calc((100%_-_14rem)/8)),1fr))]" aria-label="Movie cards"></section>
                <div id="emptyState" class="px-4 py-10 text-center text-sm text-[hsl(28_10%_39%)] dark:text-[hsl(38_14%_72%)]" hidden>No movies match the current filters.</div>
            </section>
        </div>
    </main>

    <script>
        const state = {
            movies: [],
            filtered: [],
            allInfoVisible: getInitialInfoVisible(),
        };

        function getInitialInfoVisible() {
            const saved = localStorage.getItem("info-visible");
            if (saved === "false") return false;
            if (saved === "true") return true;
            return true; // default: info visible
        }

        const refs = {
            letterToggle: document.getElementById("letterToggle"),
            letterToggleLabel: document.getElementById("letterToggleLabel"),
            letterPanel: document.getElementById("letterPanel"),
            letterOptions: document.getElementById("letterOptions"),
            letterClear: document.getElementById("letterClear"),
            searchInput: document.getElementById("searchInput"),
            genreToggle: document.getElementById("genreToggle"),
            genreToggleLabel: document.getElementById("genreToggleLabel"),
            genrePanel: document.getElementById("genrePanel"),
            genreOptions: document.getElementById("genreOptions"),
            genreClear: document.getElementById("genreClear"),
            yearToggle: document.getElementById("yearToggle"),
            yearToggleLabel: document.getElementById("yearToggleLabel"),
            yearPanel: document.getElementById("yearPanel"),
            yearOptions: document.getElementById("yearOptions"),
            yearClear: document.getElementById("yearClear"),
            sortSelect: document.getElementById("sortSelect"),
            themeToggle: document.getElementById("themeToggle"),
            widthToggle: document.getElementById("widthToggle"),
            filtersControlsGroup: document.getElementById("filtersControlsGroup"),
            searchControl: document.getElementById("searchControl"),
            genreControl: document.getElementById("genreControl"),
            yearControl: document.getElementById("yearControl"),
            sortControl: document.getElementById("sortControl"),
            countControl: document.getElementById("countControl"),
            resultsCount: document.getElementById("resultsCount"),
            filtersAside: document.getElementById("filtersAside"),
            grid: document.getElementById("grid"),
            emptyState: document.getElementById("emptyState"),
        };

        // --- Ignore Leading Articles State ---
        const articlesState = {
            ignore: false,
        };

        // --- Title Letter Filter State and Logic ---
        const letterState = {
            letters: [],
            selectedLetters: new Set(),
        };

        function renderLetterOptions() {
            const values = letterState.letters;
            const selected = letterState.selectedLetters;
            const container = refs.letterOptions;
            container.innerHTML = values
                .map((value) => {
                    const active = selected.has(value);
                    const activeClass = active
                        ? "border-[hsl(174_77%_26%)] bg-[hsl(174_77%_26%/0.14)] dark:border-[hsl(168_78%_42%)] dark:bg-[hsl(168_78%_42%/0.2)]"
                        : "border-transparent hover:bg-[hsl(36_33%_94%)] dark:hover:bg-[hsl(220_14%_24%)]";
                    const checkbox = active
                        ? `<svg class='w-4 h-4 mr-2 flex-shrink-0 text-[hsl(174_77%_26%)] dark:text-[hsl(168_78%_42%)]' fill='currentColor' viewBox='0 0 20 20'><rect x='2' y='2' width='16' height='16' rx='4' fill='currentColor'/><path d='M6 10.5l3 3 5-5' stroke='#fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>`
                        : `<svg class='w-4 h-4 mr-2 flex-shrink-0 text-[hsl(28_10%_39%)] opacity-40 dark:text-[hsl(38_18%_72%)]' fill='none' stroke='currentColor' viewBox='0 0 20 20'><rect x='2' y='2' width='16' height='16' rx='4' stroke='currentColor' stroke-width='2' fill='none'/></svg>`;
                    return `
                        <button type='button' data-value='${escapeHtml(value)}' class='flex w-full items-center rounded-md border px-2 py-1.5 text-left text-sm transition ${activeClass}'>${checkbox}<span class='truncate'>${escapeHtml(value)}</span></button>
                    `;
                })
                .join("");
        }

        function updateLetterToggleLabel() {
            const selected = [...letterState.selectedLetters];
            refs.letterToggleLabel.textContent =
                selected.length === 0
                    ? "All"
                    : selected.length === 1
                        ? selected[0]
                        : `${selected.length} selected`;
        }

        function setLetterPanelOpen(isOpen) {
            refs.letterPanel.classList.toggle("hidden", !isOpen);
            refs.letterToggle.setAttribute("aria-expanded", String(isOpen));
        }

        function wireLetterMultiSelectControl() {
            refs.letterToggle.addEventListener("click", () => {
                const isOpening = refs.letterPanel.classList.contains("hidden");
                setLetterPanelOpen(isOpening);
            });

            refs.letterControl?.addEventListener("click", (event) => {
                event.stopPropagation();
            });

            refs.letterOptions.addEventListener("click", (event) => {
                event.stopPropagation(); // Prevent closing panel on option click
                const option = event.target.closest("button[data-value]");
                if (!option) return;
                const value = option.dataset.value || "";
                if (!value) return;
                if (letterState.selectedLetters.has(value)) {
                    letterState.selectedLetters.delete(value);
                } else {
                    letterState.selectedLetters.add(value);
                }
                renderLetterOptions();
                updateLetterToggleLabel();
                applyFilters();
            });

            refs.letterClear.addEventListener("click", () => {
                letterState.selectedLetters.clear();
                renderLetterOptions();
                updateLetterToggleLabel();
                applyFilters();
            });

            document.addEventListener("click", (event) => {
                const target = event.target;
                const isElement = target instanceof Element;
                const insideControl = isElement && target.closest("#letterControl");
                if (!insideControl) {
                    refs.letterPanel.classList.add("hidden");
                    refs.letterToggle.setAttribute("aria-expanded", "false");
                }
            });

            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    refs.letterPanel.classList.add("hidden");
                    refs.letterToggle.setAttribute("aria-expanded", "false");
                }
            });
        }

        function fillLetterOptions(movies) {
            const letters = new Set();
            for (const movie of movies) {
                const rawTitle = String(movie.Title || "").trim();
                // Always ignore leading articles for letter options
                let normalized = rawTitle.replace(/^(The|An|A)\s+/i, "").trim();
                const letter = normalized[0]?.toUpperCase();
                if (letter && /[A-Z0-9]/.test(letter)) {
                    letters.add(letter);
                }
            }
            letterState.letters = [...letters].sort();
            for (const value of [...letterState.selectedLetters]) {
                if (!letterState.letters.includes(value)) {
                    letterState.selectedLetters.delete(value);
                }
            }
            renderLetterOptions();
            updateLetterToggleLabel();
        }

        function updateResultsCount() {
            refs.resultsCount.textContent = `${state.filtered.length} Titles`;
        }

        const themeState = {
            mode: "system",
            media: window.matchMedia("(prefers-color-scheme: dark)"),
        };

        const widthState = {
            mode: "boxed",
        };

        const filterState = {
            genres: [],
            years: [],
            selectedGenres: new Set(),
            selectedYears: new Set(),
        };

        const WIDTH_TOGGLE_MIN_VIEWPORT = 1400;

        const layoutState = {
            filtersResizeObserver: null,
            lastScrollY: window.scrollY,
            lastState: "shown", // "shown" or "hidden"
            lastStateY: window.scrollY,
        };

        function getSystemMode() {
            return themeState.media.matches ? "dark" : "light";
        }

        function getPreferredMode() {
            const saved = localStorage.getItem("theme-mode");
            if (saved === "dark" || saved === "light") {
                return saved;
            }
            return "system";
        }

        function applyTheme(mode) {
            const resolved = mode === "system" ? getSystemMode() : mode;
            document.documentElement.classList.toggle("dark", resolved === "dark");
            themeState.mode = mode;
            updateThemeToggleLabel();
            updateFiltersShadow();
        }

        function updateThemeToggleLabel() {
            const current = document.documentElement.classList.contains("dark") ? "dark" : "light";
            const currentLabel = current === "dark" ? "Dark" : "Light";
            refs.themeToggle.textContent = currentLabel;
            refs.themeToggle.setAttribute("aria-pressed", String(current === "dark"));
        }

        function wireTheme() {
            applyTheme(getPreferredMode());

            refs.themeToggle.addEventListener("click", () => {
                const current = document.documentElement.classList.contains("dark") ? "dark" : "light";
                const next = current === "dark" ? "light" : "dark";

        function normalize(value) {
            return String(value || "").trim().toLowerCase();
        }

        function parseNumber(value) {
            const n = Number.parseFloat(value);
            return Number.isFinite(n) ? n : NaN;
        }

        function formatCompactCount(value) {
            if (!Number.isFinite(value)) {
                return "";
            }

            const abs = Math.abs(value);
            if (abs < 1000) {
                return String(Math.round(value));
            }

            const scales = [
                { threshold: 1e9, suffix: "b" },
                { threshold: 1e6, suffix: "m" },
                { threshold: 1e3, suffix: "k" },
            ];

            for (const scale of scales) {
                if (abs >= scale.threshold) {
                    const scaled = value / scale.threshold;
                    const rounded = Math.abs(scaled) >= 10 ? scaled.toFixed(0) : scaled.toFixed(1);
                    return `${rounded.replace(/\.0$/, "")}${scale.suffix}`;
                }
            }

            return String(Math.round(value));
        }

        function posterPath(movie) {
            const imdbID = movie.imdbID || "";
            return `posters/${imdbID}.jpg`;
        }

        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function truncateText(value, maxLength) {
            const text = String(value || "").trim();
            if (text.length <= maxLength) {
                return text;
            }

            return `${text.slice(0, maxLength).trimEnd()}...`;
        }

        function ratingToneClass(imdbRating) {
            const rating = Number.parseFloat(imdbRating);
            if (!Number.isFinite(rating)) {
                return "text-[hsl(28_10%_39%)] dark:text-[hsl(38_14%_70%)]";
            }

            if (rating >= 7) {
                return "text-[hsl(142_65%_32%)] dark:text-[hsl(145_68%_62%)]";
            }

            if (rating >= 6) {
                return "text-[hsl(38_78%_44%)] dark:text-[hsl(43_90%_64%)]";
            }

            if (rating >= 4.5) {
                return "text-[hsl(27_78%_45%)] dark:text-[hsl(26_84%_62%)]";
            }

            return "text-[hsl(4_72%_45%)] dark:text-[hsl(4_82%_62%)]";
        }

        function posterFallbackDataUri() {
            const svg =
                '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600">' +
                '<rect width="100%" height="100%" fill="hsl(36 41% 87%)"/>' +
                '<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="28" fill="hsl(28 12% 39%)">No Poster</text>' +
                '</svg>';
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        function handlePosterError(img) {
            const imdbID = img.dataset.imdb || "";
            const posterUrl = img.dataset.posterUrl || "";
            const step = Number(img.dataset.step || "0");

            if (!imdbID) {
                img.src = posterFallbackDataUri();
                return;
            }

            const localCandidates = [
                `posters/${imdbID}.jpg`,
                `posters/${imdbID}.png`,
                `posters/${imdbID}.webp`,
            ];

            if (step < localCandidates.length - 1) {
                const nextStep = step + 1;
                img.dataset.step = String(nextStep);
                img.src = localCandidates[nextStep];
                return;
            }

            if (step === localCandidates.length - 1 && posterUrl && posterUrl !== "N/A") {
                img.dataset.step = String(localCandidates.length);
                img.src = posterUrl;
                return;
            }

            img.onerror = null;
            img.src = posterFallbackDataUri();
        }

        function fillFilterOptions(movies) {
            const genres = new Set();
            const years = new Set();

            for (const movie of movies) {
                String(movie.Genre || "")
                    .split(",")
                    .map((g) => g.trim())
                    .filter(Boolean)
                    .forEach((g) => genres.add(g));

                if (movie.Year && movie.Year !== "N/A") {
                    years.add(String(movie.Year));
                }
            }

            const sortedGenres = [...genres].sort((a, b) => a.localeCompare(b));
            const sortedYears = [...years].sort((a, b) => Number(b) - Number(a));

            filterState.genres = sortedGenres;
            filterState.years = sortedYears;

            for (const value of [...filterState.selectedGenres]) {
                if (!filterState.genres.includes(value)) {
                    filterState.selectedGenres.delete(value);
                }
            }

            for (const value of [...filterState.selectedYears]) {
                if (!filterState.years.includes(value)) {
                    filterState.selectedYears.delete(value);
                }
            }

            renderMultiOptions("genre");
            renderMultiOptions("year");
            updateMultiToggleLabels();
            fillLetterOptions(movies);
        }

        function applyFilters() {
            const query = normalize(refs.searchInput.value);
            const selectedGenres = [...filterState.selectedGenres];
            const selectedYears = [...filterState.selectedYears];
            const sort = refs.sortSelect.value;

            let result = state.movies.filter((movie) => {
                const haystack = [movie.Title, movie.Actors, movie.Director, movie.Plot, movie.Genre]
                    .map(normalize)
                    .join(" ");

                const matchesQuery = !query || haystack.includes(query);
                const movieGenres = String(movie.Genre || "").split(",").map((g) => g.trim()).filter(Boolean);
                const movieYear = String(movie.Year || "");
                const matchesGenre = !selectedGenres.length || selectedGenres.some((genre) => movieGenres.includes(genre));
                const matchesYear = !selectedYears.length || selectedYears.includes(movieYear);
                const selectedLetters = [...letterState.selectedLetters];
                const rawTitle = String(movie.Title || "").trim();
                let ignoreArticles = articlesState.ignore;
                let firstLetter = rawTitle[0]?.toUpperCase() || "";
                let altLetter = null;
                let effectiveLetter = firstLetter;
                if (ignoreArticles) {
                    // Always ignore A, An, The for filtering
                    const normalized = rawTitle.replace(/^(The|An|A)\s+/i, "").trim();
                    effectiveLetter = normalized[0]?.toUpperCase() || "";
                } else {
                    // Only ignore 'The' for altLetter, and only allow altLetter if the selected letter is NOT the first letter
                    if (/^The\s+/i.test(rawTitle)) {
                        altLetter = rawTitle.slice(4).trim()[0]?.toUpperCase() || null;
                    }
                }
                let matchesLetter = false;
                if (!selectedLetters.length) {
                    matchesLetter = true;
                } else {
                    if (ignoreArticles) {
                        // Only match the effective letter (after ignoring articles)
                        if (selectedLetters.includes(effectiveLetter)) {
                            matchesLetter = true;
                        }
                    } else {
                        // When not ignoring articles, only match the first letter
                        if (selectedLetters.includes(firstLetter)) {
                            matchesLetter = true;
                        }
                    }
                }
                return matchesQuery && matchesGenre && matchesYear && matchesLetter;
            });

            result = result.sort((a, b) => {
                function normalizeSortTitle(title) {
                    let t = String(title || "").trim().toLowerCase();
                    if (articlesState.ignore) {
                        if (t.startsWith("the ")) t = t.slice(4);
                        else if (t.startsWith("an ")) t = t.slice(3);
                        else if (t.startsWith("a ")) t = t.slice(2);
                    } else {
                        if (t.startsWith("the ")) t = t.slice(4);
                    }
                    return t.trim();
                }
                if (sort === "title-asc") {
                    return normalizeSortTitle(a.Title).localeCompare(normalizeSortTitle(b.Title));
                }
                if (sort === "title-desc") {
                    return normalizeSortTitle(b.Title).localeCompare(normalizeSortTitle(a.Title));
                }
                if (sort === "year-desc") {
                    return Number(b.Year || 0) - Number(a.Year || 0);
                }
                if (sort === "year-asc") {
                    return Number(a.Year || 0) - Number(b.Year || 0);
                }
                if (sort === "rating-desc") {
                    return parseNumber(b.imdbRating) - parseNumber(a.imdbRating);
                }
                if (sort === "rating-asc") {
                    return parseNumber(a.imdbRating) - parseNumber(b.imdbRating);
                }
                if (sort === "votes-desc" || sort === "votes-asc") {
                    const getVotes = (m) => {
                        const raw = String(m.imdbVotes || "").replace(/,/g, "");
                        const n = Number.parseInt(raw, 10);
                        return Number.isFinite(n) ? n : 0;
                    };
                    const av = getVotes(a);
                    const bv = getVotes(b);
                    return sort === "votes-desc" ? bv - av : av - bv;
                }
                if (sort === "runtime-desc" || sort === "runtime-asc") {
                    const getRuntime = (m) => {
                        const match = String(m.Runtime || "").match(/(\d+)\s*min/i);
                        return match ? parseInt(match[1], 10) : 0;
                    };
                    const ar = getRuntime(a);
                    const br = getRuntime(b);
                    return sort === "runtime-desc" ? br - ar : ar - br;
                }
                return 0;
            });

            state.filtered = result;
            render();
        }

        function formatRuntime(runtimeStr) {
            if (!runtimeStr || runtimeStr === "N/A") return "Unknown runtime";
            const match = runtimeStr.match(/(\d+)\s*min/i);
            if (!match) return runtimeStr;
            const mins = parseInt(match[1], 10);
            if (!Number.isFinite(mins)) return runtimeStr;
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            let result = "";
            if (h > 0) result += `${h}h`;
            if (m > 0 || h === 0) result += `${h > 0 ? " " : ""}${m}m`;
            return result.trim();
        }

        function cardTemplate(movie) {
            // Global info visibility state
            const infoVisible = state.allInfoVisible !== false;
            const genres = String(movie.Genre || "")

                .join("");

            const rating = movie.imdbRating && movie.imdbRating !== "N/A" ? movie.imdbRating : "-";

            const hasVotes = /^\d+$/.test(votesDigits);
            const votes = hasVotes ? formatCompactCount(Number(votesDigits)) : "";
            const ratingWithVotes = hasVotes ? `${escapeHtml(rating)} (${escapeHtml(votes)})` : escapeHtml(rating);
            const runtime = formatRuntime(movie.Runtime);
            const year = movie.Year || "Unknown year";
            const title = escapeHtml(movie.Title || "Untitled");
            const fullPlot = escapeHtml(movie.Plot || "No plot available.");
            const plot = escapeHtml(truncateText(movie.Plot || "No plot available.", 95));
            const ratingTone = ratingToneClass(movie.imdbRating);
            const actorPills = String(movie.Actors || "")
                .split(",")
                .map((a) => a.trim())
                .filter(Boolean)
                .slice(0, 3)
                .map((a) => `<span class="shrink-0 rounded-full border border-[hsl(188_33%_74%)] bg-[hsl(189_54%_92%)] px-2.5 py-1 text-xs text-[hsl(191_37%_27%)] dark:border-[hsl(191_25%_34%)] dark:bg-[hsl(192_34%_24%)] dark:text-[hsl(187_39%_82%)]">${escapeHtml(a)}</span>`)
                .join("") || '<span class="text-[0.9rem] text-[hsl(28_10%_39%)] dark:text-[hsl(38_14%_70%)]">Actors unavailable</span>';
            const imdb = escapeHtml(movie.imdbID || "");
            const imdbIdRaw = String(movie.imdbID || "").trim();
            const imdbUrl = /^tt\d+$/.test(imdbIdRaw) ? `https://www.imdb.com/title/${imdbIdRaw}/` : "";
            const remotePoster = escapeHtml(movie.Poster || "");

            return `
                <article class="group flex min-h-full flex-col overflow-hidden rounded-xl border border-[hsl(32_32%_75%)] shadow-[0_8px_20px_hsl(32_58%_13%/0.12)] transition duration-150 transform-gpu hover:scale-[1.01] hover:shadow-[0_14px_28px_hsl(32_58%_13%/0.22)] dark:border-[hsl(220_15%_27%)] dark:shadow-[0_8px_24px_hsl(220_45%_5%/0.5)] dark:hover:shadow-[0_14px_30px_hsl(220_48%_3%/0.72)]">
                    <img class="aspect-[2/3] w-full object-cover bg-[hsl(37_43%_90%)] dark:bg-[hsl(220_15%_20%)]" loading="lazy" src="${posterPath(movie)}" alt="${title} poster" data-imdb="${imdb}" data-poster-url="${remotePoster}" data-step="0" onerror="handlePosterError(this)" />
                    <div class="flex flex-1 flex-col gap-2 bg-[hsl(40_100%_99%/0.68)] p-4 transition-colors duration-150 group-hover:bg-[hsl(40_100%_99%/0.96)] dark:bg-[hsl(220_14%_17%/0.9)] dark:group-hover:bg-[hsl(220_14%_21%/0.95)]" style="display:${infoVisible ? "flex" : "none"}">
                        <h2 class="m-0 text-[1.2rem] font-medium leading-6 text-[hsl(24_17%_10%)] dark:text-[hsl(43_33%_92%)]">${imdbUrl ? `<a href="${imdbUrl}" target="_blank" rel="noopener noreferrer" class="text-[hsl(208_72%_36%)] transition hover:text-[hsl(208_78%_30%)] hover:underline hover:underline-offset-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[hsl(208_72%_36%/0.35)] focus-visible:ring-offset-2 focus-visible:ring-offset-[hsl(40_100%_99%)] dark:text-[hsl(198_84%_71%)] dark:hover:text-[hsl(198_92%_80%)] dark:focus-visible:ring-[hsl(198_84%_71%/0.35)] dark:focus-visible:ring-offset-[hsl(220_14%_18%)]">${title}</a>` : title}</h2>
                        <div class="flex flex-wrap items-center gap-x-3 gap-y-2 text-[0.95rem] leading-7 text-[hsl(29_13%_31%)] dark:text-[hsl(38_14%_74%)]">
                            <span>${escapeHtml(year)}</span>
                            <span aria-hidden="true">&middot;</span>
                            <span>${escapeHtml(runtime)}</span>
                            <span aria-hidden="true">&middot;</span>
                            <span class="${ratingTone}"><span style="font-size:1.1em;line-height:1;display:inline-block;">★</span> ${ratingWithVotes}</span>
                        </div>
                        <div class="flex items-center gap-2" title="${escapeHtml(movie.Actors || "Actors unavailable")}">
                            <span class="shrink-0 text-[0.9rem] text-[hsl(29_13%_31%)] dark:text-[hsl(38_14%_74%)]">Stars:</span>
                            <div class="no-scrollbar flex min-w-0 flex-1 flex-nowrap items-center gap-2 overflow-x-auto whitespace-nowrap" style="-ms-overflow-style:none;scrollbar-width:none;">${actorPills}</div>
                        </div>
                        <div class="flex flex-wrap gap-2 my-1">${genres}</div>
                        <p class="m-0 text-[0.95rem] leading-[1.45] text-[hsl(30_14%_24%)] dark:text-[hsl(40_16%_82%)]" title="${fullPlot}" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">${plot}</p>
                    </div>
                </article>
            `;
        }

        function render() {
            updateResultsCount();

            if (!state.filtered.length) {
                refs.grid.innerHTML = "";
                refs.emptyState.hidden = false;
                return;
            }

            refs.emptyState.hidden = true;
            refs.grid.innerHTML = state.filtered.map(cardTemplate).join("");

            // Wire up info toggle button in filters
            const infoToggle = document.getElementById("infoToggle");
            if (infoToggle) {
                infoToggle.textContent = state.allInfoVisible === false ? "Off" : "On";
                infoToggle.setAttribute("aria-pressed", String(state.allInfoVisible !== false));
                infoToggle.onclick = () => {
                    state.allInfoVisible = state.allInfoVisible === false ? true : false;
                    localStorage.setItem("info-visible", String(state.allInfoVisible));
                    render();
                };
            }
        }

        async function loadMovies() {
            const response = await fetch("movies.json", { cache: "no-store" });
            if (!response.ok) {
                throw new Error(`Failed to load movies.json: ${response.status}`);
            }

            const movies = await response.json();
            if (!Array.isArray(movies)) {
                throw new Error("movies.json must contain an array");
            }

            state.movies = movies;
            fillFilterOptions(movies);
            applyFilters();
        }

        function wireEvents() {
            refs.searchInput.addEventListener("input", applyFilters);
            refs.sortSelect.addEventListener("change", applyFilters);
            // Wire up ignore articles checkbox
            const cb = document.getElementById("ignoreArticlesCheckbox");
            cb.checked = articlesState.ignore;
            cb.addEventListener("change", (e) => {
                articlesState.ignore = cb.checked;
                applyFilters();
            });
        }

        async function init() {
            wireTheme();
            wireGridWidthToggle();
            wireMultiSelectControls();
            wireLetterMultiSelectControl();
            wireEvents();
            try {
                await loadMovies();
            } catch (error) {
                refs.emptyState.hidden = false;
                refs.emptyState.textContent = error.message;
            }
        }

        init();
    </script>
</body>
</html>
