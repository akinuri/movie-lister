<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Lister</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: [
                            'ui-sans-serif',
                            'system-ui',
                            'Segoe UI',
                            'Roboto',
                            'Helvetica Neue',
                            'Arial',
                            'sans-serif',
                        ],
                    },
                },
            },
        };
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        #grid.list-view {
            grid-template-columns: minmax(0, 1fr) !important;
        }

        #grid.list-view .movie-card {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            background-color: hsl(40 100% 99% / 0.68);
        }

        .dark #grid.list-view .movie-card {
            background-color: hsl(220 14% 17% / 0.9);
        }

        #grid.list-view .movie-poster {
            width: clamp(96px, 12vw, 120px);
            flex: 0 0 auto;
        }

        #grid.list-view .movie-body {
            flex: 1 1 auto;
            align-self: auto;
            display: flex !important;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
            padding: 12px 14px;
            background: transparent !important;
        }

        #grid.list-view .movie-top-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-items: center;
            gap: 4rem;
            width: 100%;
        }

        #grid.list-view .movie-title {
            flex: 0 1 auto;
            min-width: 0;
            max-width: min(56ch, 100%);
            line-height: 1.3;
        }

        #grid.list-view .movie-meta {
            flex: 0 0 auto;
            white-space: nowrap;
            margin: 0;
        }

        #grid.list-view .movie-stars {
            flex: 0 1 auto;
            min-width: 0;
            margin: 0;
        }

        #grid.list-view .movie-stars .no-scrollbar {
            overflow-x: auto;
            overflow-y: hidden;
            flex: 1 1 auto;
            max-width: none;
        }

        #grid.list-view .movie-genres {
            flex: 0 1 auto;
            margin: 0;
        }

        #grid .movie-plot-list {
            display: none;
        }

        #grid.list-view .movie-plot-grid {
            display: none !important;
        }

        #grid.list-view .movie-plot-list {
            display: block !important;
            flex: 0 0 100%;
            margin-top: 10px;
            overflow: visible !important;
            -webkit-line-clamp: unset !important;
            -webkit-box-orient: initial !important;
        }

        #grid.list-view .movie-plot {
            flex: 0 0 100%;
            margin-top: 10px;
        }

        #grid.list-view .movie-tags {
            flex: 0 0 100%;
            display: flex !important;
            margin-top: 2px;
        }

        @media (max-width: 980px) {
            #grid.list-view .movie-title {
                max-width: 100%;
            }

            #grid.list-view .movie-stars {
                min-width: 0;
            }
        }

        @media (max-width: 860px) {
            #grid.list-view .movie-body {
                gap: 8px;
            }

            #grid.list-view .movie-title,
            #grid.list-view .movie-meta,
            #grid.list-view .movie-stars,
            #grid.list-view .movie-genres,
            #grid.list-view .movie-plot,
            #grid.list-view .movie-tags {
                flex-basis: 100%;
            }
        }
    </style>
</head>

    <script>
        const state = {
            movies: [],
            filtered: [],
            allInfoVisible: getInitialInfoVisible(),
        };

        function getInitialInfoVisible() {
            const saved = localStorage.getItem("info-visible");
            if (saved === "false") return false;
            if (saved === "true") return true;
            return true; // default: info visible
        }

        const refs = {
            letterToggle: document.getElementById("letterToggle"),
            letterToggleLabel: document.getElementById("letterToggleLabel"),
            letterPanel: document.getElementById("letterPanel"),
            letterOptions: document.getElementById("letterOptions"),
            letterClear: document.getElementById("letterClear"),
            letterControl: document.getElementById("letterControl"),
            searchInput: document.getElementById("searchInput"),
            genreToggle: document.getElementById("genreToggle"),
            genreToggleLabel: document.getElementById("genreToggleLabel"),
            genrePanel: document.getElementById("genrePanel"),
            genreOptions: document.getElementById("genreOptions"),
            genreClear: document.getElementById("genreClear"),
            typeToggle: document.getElementById("typeToggle"),
            typeToggleLabel: document.getElementById("typeToggleLabel"),
            typePanel: document.getElementById("typePanel"),
            typeOptions: document.getElementById("typeOptions"),
            typeClear: document.getElementById("typeClear"),
            yearToggle: document.getElementById("yearToggle"),
            yearToggleLabel: document.getElementById("yearToggleLabel"),
            yearPanel: document.getElementById("yearPanel"),
            yearOptions: document.getElementById("yearOptions"),
            yearClear: document.getElementById("yearClear"),
            runtimeToggle: document.getElementById("runtimeToggle"),
            runtimeToggleLabel: document.getElementById("runtimeToggleLabel"),
            runtimePanel: document.getElementById("runtimePanel"),
            runtimeOptions: document.getElementById("runtimeOptions"),
            runtimeClear: document.getElementById("runtimeClear"),
            tagToggle: document.getElementById("tagToggle"),
            tagToggleLabel: document.getElementById("tagToggleLabel"),
            tagPanel: document.getElementById("tagPanel"),
            tagOptions: document.getElementById("tagOptions"),
            tagClear: document.getElementById("tagClear"),
            tagControl: document.getElementById("tagControl"),
            runtimeControl: document.getElementById("runtimeControl"),
            sortSelect: document.getElementById("sortSelect"),
            themeToggle: document.getElementById("themeToggle"),
            widthToggle: document.getElementById("widthToggle"),
            cardViewToggle: document.getElementById("cardViewToggle"),
            exportJsonButton: document.getElementById("exportJsonButton"),
            controlsToggle: document.getElementById("controlsToggle"),
            controlsRow: document.getElementById("controlsRow"),
            filtersControlsGroup: document.getElementById("filtersControlsGroup"),
            searchControl: document.getElementById("searchControl"),
            typeControl: document.getElementById("typeControl"),
            genreControl: document.getElementById("genreControl"),
            yearControl: document.getElementById("yearControl"),
            sortControl: document.getElementById("sortControl"),
            countControl: document.getElementById("countControl"),
            resultsCount: document.getElementById("resultsCount"),
            filtersAside: document.getElementById("filtersAside"),
            grid: document.getElementById("grid"),
            emptyState: document.getElementById("emptyState"),
        };

        // --- Ignore Leading Articles State ---
        const articlesState = {
            ignore: false,
        };

        // --- Title Letter Filter State and Logic ---
        const letterState = {
            letters: [],
            selectedLetters: new Set(),
        };

        function renderLetterOptions() {
            const values = letterState.letters;
            const selected = letterState.selectedLetters;
            const container = refs.letterOptions;
            container.innerHTML = values
                .map((value) => {
                    const active = selected.has(value);
                    const activeClass = active
                        ? "border-[hsl(174_77%_26%)] bg-[hsl(174_77%_26%/0.14)] dark:border-[hsl(168_78%_42%)] dark:bg-[hsl(168_78%_42%/0.2)]"
                        : "border-transparent hover:bg-[hsl(36_33%_94%)] dark:hover:bg-[hsl(220_14%_24%)]";
                    const checkbox = active
                        ? `<svg class='w-4 h-4 mr-2 flex-shrink-0 text-[hsl(174_77%_26%)] dark:text-[hsl(168_78%_42%)]' fill='currentColor' viewBox='0 0 20 20'><rect x='2' y='2' width='16' height='16' rx='4' fill='currentColor'/><path d='M6 10.5l3 3 5-5' stroke='#fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>`
                        : `<svg class='w-4 h-4 mr-2 flex-shrink-0 text-[hsl(28_10%_39%)] opacity-40 dark:text-[hsl(38_18%_72%)]' fill='none' stroke='currentColor' viewBox='0 0 20 20'><rect x='2' y='2' width='16' height='16' rx='4' stroke='currentColor' stroke-width='2' fill='none'/></svg>`;
                    return `
                        <button type='button' data-value='${escapeHtml(value)}' class='flex w-full items-center rounded-md border px-2 py-1.5 text-left text-sm ${activeClass}'>${checkbox}<span class='truncate'>${escapeHtml(value)}</span></button>
                    `;
                })
                .join("");
        }

        function updateLetterToggleLabel() {
            const selected = [...letterState.selectedLetters];
            refs.letterToggleLabel.textContent =
                selected.length === 0
                    ? "All"
                    : selected.length === 1
                        ? selected[0]
                        : `${selected.length} selected`;
        }

        function setLetterPanelOpen(isOpen) {
            refs.letterPanel.classList.toggle("hidden", !isOpen);
            refs.letterToggle.setAttribute("aria-expanded", String(isOpen));
        }

        function wireLetterMultiSelectControl() {
            refs.letterToggle.addEventListener("click", () => {
                const isOpening = refs.letterPanel.classList.contains("hidden");
                if (isOpening) {
                    closeFilterPanels();
                }
                setLetterPanelOpen(isOpening);
            });

            refs.letterControl?.addEventListener("click", (event) => {
                event.stopPropagation();
            });

            refs.letterOptions.addEventListener("click", (event) => {
                event.stopPropagation(); // Prevent closing panel on option click
                const option = event.target.closest("button[data-value]");
                if (!option) return;
                const value = option.dataset.value || "";
                if (!value) return;
                if (letterState.selectedLetters.has(value)) {
                    letterState.selectedLetters.delete(value);
                } else {
                    letterState.selectedLetters.add(value);
                }
                renderLetterOptions();
                updateLetterToggleLabel();
                applyFilters();
            });

            refs.letterClear.addEventListener("click", () => {
                letterState.selectedLetters.clear();
                renderLetterOptions();
                updateLetterToggleLabel();
                applyFilters();
            });

            document.addEventListener("click", (event) => {
                const target = event.target;
                const isElement = target instanceof Element;
                const insideControl = isElement && target.closest("#letterControl");
                if (!insideControl) {
                    refs.letterPanel.classList.add("hidden");
                    refs.letterToggle.setAttribute("aria-expanded", "false");
                }
            });

            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    refs.letterPanel.classList.add("hidden");
                    refs.letterToggle.setAttribute("aria-expanded", "false");
                }
            });
        }

        function fillLetterOptions(movies) {
            const letters = new Set();
            for (const movie of movies) {
                const rawTitle = String(movie.Title || "").trim();
                // Always ignore leading articles for letter options
                let normalized = rawTitle.replace(/^(The|An|A)\s+/i, "").trim();
                const letter = normalized[0]?.toUpperCase();
                if (letter && /[A-Z0-9]/.test(letter)) {
                    letters.add(letter);
                }
            }
            letterState.letters = [...letters].sort();
            for (const value of [...letterState.selectedLetters]) {
                if (!letterState.letters.includes(value)) {
                    letterState.selectedLetters.delete(value);
                }
            }
            renderLetterOptions();
            updateLetterToggleLabel();
        }

        function updateResultsCount() {
            refs.resultsCount.textContent = `${state.filtered.length} Titles`;
        }

        const themeState = {
            mode: "system",
            media: window.matchMedia("(prefers-color-scheme: dark)"),
        };

        const widthState = {
            mode: "boxed",
        };

        const cardViewState = {
            mode: "grid",
        };

        const controlsState = {
            visible: false,
        };

        const filterState = {
            types: [],
            genres: [],
            years: [],
            runtimes: [],
            tags: [],
            selectedTypes: new Set(),
            selectedGenres: new Set(),
            selectedYears: new Set(),
            selectedRuntimes: new Set(),
            selectedTags: new Set(),
        };

        const TAG_FILTER_UNTAGGED = "__untagged__";

        const WIDTH_TOGGLE_MIN_VIEWPORT = 1400;

        const layoutState = {
            filtersResizeObserver: null,
            lastScrollY: window.scrollY,
            lastState: "shown", // "shown" or "hidden"
            lastStateY: window.scrollY,
            suppressScrollHideUntil: 0,
        };

        function getSystemMode() {
            return themeState.media.matches ? "dark" : "light";
        }

        function getPreferredMode() {
            const saved = localStorage.getItem("theme-mode");
            if (saved === "dark" || saved === "light") {
                return saved;
            }
            return "system";
        }

        function applyTheme(mode) {
            const resolved = mode === "system" ? getSystemMode() : mode;
            document.documentElement.classList.toggle("dark", resolved === "dark");
            themeState.mode = mode;
            updateThemeToggleLabel();
            updateFiltersShadow();
        }

        function updateThemeToggleLabel() {
            const current = document.documentElement.classList.contains("dark") ? "dark" : "light";
            const currentLabel = current === "dark" ? "Dark" : "Light";
            refs.themeToggle.textContent = currentLabel;
            refs.themeToggle.setAttribute("aria-pressed", String(current === "dark"));
        }

        function wireTheme() {
            applyTheme(getPreferredMode());

            refs.themeToggle.addEventListener("click", () => {
                const current = document.documentElement.classList.contains("dark") ? "dark" : "light";
                const next = current === "dark" ? "light" : "dark";
                localStorage.setItem("theme-mode", next);
                applyTheme(next);
            });

            themeState.media.addEventListener("change", () => {
                if (themeState.mode === "system") {
                    applyTheme("system");
                }
            });
        }

        function getPreferredGridWidthMode() {
            const saved = localStorage.getItem("grid-width-mode");
            if (saved === "boxed" || saved === "full") {
                return saved;
            }
            return "boxed";
        }

        function getPreferredCardViewMode() {
            const saved = localStorage.getItem("card-view-mode");
            if (saved === "list" || saved === "grid") {
                return saved;
            }
            return "grid";
        }

        function updateCardViewToggleLabel() {
            const current = cardViewState.mode === "list" ? "list" : "grid";
            refs.cardViewToggle.textContent = current === "list" ? "List" : "Grid";
            refs.cardViewToggle.setAttribute("aria-pressed", String(current === "list"));
        }

        function applyCardView(mode) {
            const resolved = mode === "list" ? "list" : "grid";
            cardViewState.mode = resolved;
            refs.grid.classList.toggle("list-view", resolved === "list");
            updateCardViewToggleLabel();
        }

        function wireCardViewToggle() {
            applyCardView(getPreferredCardViewMode());
            refs.cardViewToggle.addEventListener("click", () => {
                const next = cardViewState.mode === "list" ? "grid" : "list";
                localStorage.setItem("card-view-mode", next);
                applyCardView(next);
            });
        }

        function getPreferredControlsVisibility() {
            const saved = localStorage.getItem("filters-controls-visible");
            if (saved === "true") {
                return true;
            }
            if (saved === "false") {
                return false;
            }
            return false;
        }

        function applyControlsVisibility(isVisible) {
            controlsState.visible = isVisible;
            refs.controlsRow.classList.toggle("hidden", !isVisible);
            refs.controlsRow.classList.toggle("flex", isVisible);
            refs.controlsToggle.setAttribute("aria-pressed", String(isVisible));
            refs.controlsToggle.setAttribute("aria-label", isVisible ? "Hide control buttons" : "Show control buttons");
            refs.controlsToggle.title = isVisible ? "Hide controls" : "Show controls";

            // Expanding/collapsing the controls row can nudge scroll position; don't treat that as user scroll.
            layoutState.suppressScrollHideUntil = performance.now() + 300;
            layoutState.lastScrollY = window.scrollY;
            layoutState.lastStateY = window.scrollY;
        }

        function wireControlsToggle() {
            applyControlsVisibility(getPreferredControlsVisibility());
            refs.controlsToggle.addEventListener("click", () => {
                const next = !controlsState.visible;
                localStorage.setItem("filters-controls-visible", String(next));
                applyControlsVisibility(next);
            });
        }

        function getEffectiveGridWidthMode() {
            return window.innerWidth >= WIDTH_TOGGLE_MIN_VIEWPORT ? widthState.mode : "full";
        }

        function updateFiltersControlsLayout() {
            const asideWidth = refs.filtersAside.clientWidth;
            const effectiveMode = getEffectiveGridWidthMode();
            const rowThreshold = effectiveMode === "boxed" ? 1080 : 1240;
            const isColumn = asideWidth < rowThreshold;

            // Keep filters in one of two explicit layouts only: row or column.
            refs.filtersControlsGroup.style.flexDirection = isColumn ? "column" : "row";
            refs.filtersControlsGroup.style.flexWrap = "nowrap";
            refs.filtersControlsGroup.style.alignItems = isColumn ? "stretch" : "flex-end";

            refs.searchControl.style.width = isColumn ? "100%" : "16rem";
            refs.letterControl.style.width = isColumn ? "100%" : "6rem";
            refs.typeControl.style.width = isColumn ? "100%" : "8rem";
            refs.genreControl.style.width = isColumn ? "100%" : "10rem";
            refs.yearControl.style.width = isColumn ? "100%" : "8rem";
            refs.runtimeControl.style.width = isColumn ? "100%" : "8rem";
            refs.tagControl.style.width = isColumn ? "100%" : "9rem";
            refs.sortControl.style.width = isColumn ? "100%" : "7rem";
            refs.countControl.style.width = isColumn ? "100%" : "90px";
            refs.countControl.style.marginBottom = isColumn ? "0" : "0.5rem";
        }

        function closeFilterPanels() {
            setLetterPanelOpen(false);
            refs.typePanel.classList.add("hidden");
            refs.genrePanel.classList.add("hidden");
            refs.yearPanel.classList.add("hidden");
            refs.runtimePanel.classList.add("hidden");
            refs.tagPanel.classList.add("hidden");
            refs.typeToggle.setAttribute("aria-expanded", "false");
            refs.genreToggle.setAttribute("aria-expanded", "false");
            refs.yearToggle.setAttribute("aria-expanded", "false");
            refs.runtimeToggle.setAttribute("aria-expanded", "false");
            refs.tagToggle.setAttribute("aria-expanded", "false");
        }

        function setFilterPanelOpen(name, isOpen) {
            setLetterPanelOpen(false);

            const panelMap = {
                type: refs.typePanel,
                genre: refs.genrePanel,
                year: refs.yearPanel,
                runtime: refs.runtimePanel,
                tag: refs.tagPanel,
            };
            const toggleMap = {
                type: refs.typeToggle,
                genre: refs.genreToggle,
                year: refs.yearToggle,
                runtime: refs.runtimeToggle,
                tag: refs.tagToggle,
            };

            for (const key of Object.keys(panelMap)) {
                if (key === name) continue;
                panelMap[key].classList.add("hidden");
                toggleMap[key].setAttribute("aria-expanded", "false");
            }

            panelMap[name].classList.toggle("hidden", !isOpen);
            toggleMap[name].setAttribute("aria-expanded", String(isOpen));
        }

        function renderMultiOptions(kind) {
            const isType = kind === "type";
            const isGenre = kind === "genre";
            const isYear = kind === "year";
            const isRuntime = kind === "runtime";
            const values = isType ? filterState.types : isGenre ? filterState.genres : isYear ? filterState.years : isRuntime ? filterState.runtimes : filterState.tags;
            const selected = isType ? filterState.selectedTypes : isGenre ? filterState.selectedGenres : isYear ? filterState.selectedYears : isRuntime ? filterState.selectedRuntimes : filterState.selectedTags;
            const container = isType ? refs.typeOptions : isGenre ? refs.genreOptions : isYear ? refs.yearOptions : isRuntime ? refs.runtimeOptions : refs.tagOptions;

            container.innerHTML = values
                .map((value) => {
                    const active = selected.has(value);
                    const activeClass = active
                        ? "border-[hsl(174_77%_26%)] bg-[hsl(174_77%_26%/0.14)] dark:border-[hsl(168_78%_42%)] dark:bg-[hsl(168_78%_42%/0.2)]"
                        : "border-transparent hover:bg-[hsl(36_33%_94%)] dark:hover:bg-[hsl(220_14%_24%)]";
                    const label = kind === "tag" && value === TAG_FILTER_UNTAGGED ? "Untagged" : value;
                    // SVG checkbox: filled if active, faded if not

        function updateFiltersScrollVisibility() {
            if (performance.now() < layoutState.suppressScrollHideUntil) {

            const currentScrollY = window.scrollY;
            if (typeof layoutState.lastScrollY !== "number") layoutState.lastScrollY = currentScrollY;
            if (typeof layoutState.lastState !== "string") layoutState.lastState = "shown";

            // Show on scroll up, hide on scroll down
            if (currentScrollY < 32 || currentScrollY < layoutState.lastScrollY) {

                    refs.filtersAside.style.transform = "translateY(0)";
                    refs.filtersAside.style.opacity = "1";

                    refs.filtersAside.style.opacity = "0";

        function normalize(value) {
            return String(value || "").trim().toLowerCase();
        }

        function parseNumber(value) {
            const n = Number.parseFloat(value);
            return Number.isFinite(n) ? n : NaN;
        }

        function normalizeTag(value) {
            return String(value || "")
                .trim()
                .replace(/\s+/g, " ");
        }

        function sanitizeTagList(rawTags) {
            const values = Array.isArray(rawTags)
                ? rawTags
                : typeof rawTags === "string"
                    ? rawTags.split(",")
                    : [];
            const dedup = new Set();
            const result = [];

            for (const value of values) {
                const tag = normalizeTag(value);
                if (!tag) {
                    continue;
                }
                const key = tag.toLowerCase();
                if (dedup.has(key)) {
                    continue;
                }
                dedup.add(key);
                result.push(tag);
            }

            return result;
        }

        function formatCompactCount(value) {
            if (!Number.isFinite(value)) {
                return "";
            }

            const abs = Math.abs(value);
            if (abs < 1000) {
                return String(Math.round(value));
            }

            const scales = [
                { threshold: 1e9, suffix: "b" },
                { threshold: 1e6, suffix: "m" },
                { threshold: 1e3, suffix: "k" },
            ];

            for (const scale of scales) {
                if (abs >= scale.threshold) {
                    const scaled = value / scale.threshold;
                    const rounded = Math.abs(scaled) >= 10 ? scaled.toFixed(0) : scaled.toFixed(1);
                    return `${rounded.replace(/\.0$/, "")}${scale.suffix}`;
                }
            }

            return String(Math.round(value));
        }

        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");

        function truncateText(value, maxLength) {
            const text = String(value || "").trim();
            if (text.length <= maxLength) {
                return text;
            }

            return `${text.slice(0, maxLength).trimEnd()}...`;
        }

        function ratingToneClass(imdbRating) {
            const rating = Number.parseFloat(imdbRating);
            if (!Number.isFinite(rating)) {
                return "text-[hsl(28_10%_39%)] dark:text-[hsl(38_14%_70%)]";
            }

            if (rating >= 7) {
                return "text-[hsl(142_65%_32%)] dark:text-[hsl(145_68%_62%)]";
            }

            if (rating >= 6) {
                return "text-[hsl(38_78%_44%)] dark:text-[hsl(43_90%_64%)]";
            }

            if (rating >= 4.5) {
                return "text-[hsl(27_78%_45%)] dark:text-[hsl(26_84%_62%)]";
            }

            return "text-[hsl(4_72%_45%)] dark:text-[hsl(4_82%_62%)]";
        }

        function posterFallbackDataUri() {
            const svg =
                '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600">' +
                '<rect width="100%" height="100%" fill="hsl(36 41% 87%)"/>' +
                '<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="28" fill="hsl(28 12% 39%)">No Poster</text>' +
                '</svg>';
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        function handlePosterError(img) {
            const imdbID = img.dataset.imdb || "";
            const posterUrl = img.dataset.posterUrl || "";
            const step = Number(img.dataset.step || "0");

            if (!imdbID) {
                img.src = posterFallbackDataUri();
                return;
            }

            const localCandidates = [
                `posters/${imdbID}.jpg`,
                `posters/${imdbID}.png`,
                `posters/${imdbID}.webp`,
            ];

            if (step < localCandidates.length - 1) {
                const nextStep = step + 1;
                img.dataset.step = String(nextStep);
                img.src = localCandidates[nextStep];
                return;
            }

            if (step === localCandidates.length - 1 && posterUrl && posterUrl !== "N/A") {
                img.dataset.step = String(localCandidates.length);
                img.src = posterUrl;
                return;
            }

            img.onerror = null;
            img.src = posterFallbackDataUri();
        }

        function runtimeBucketLabel(runtimeValue) {
            const match = String(runtimeValue || "").match(/(\d+)\s*min/i);
            if (!match) {
                return "";
            }
            const mins = Number.parseInt(match[1], 10);
            if (!Number.isFinite(mins)) {
                return "";
            }
            const bucketStart = Math.round(mins / 10) * 10;
            const hours = Math.floor(bucketStart / 60);
            const minutes = bucketStart % 60;
            return `${hours}h ${minutes}m`;
        }

        function parseRuntimeBucketLabelMinutes(label) {
            const hmMatch = String(label || "").match(/^(\d+)h\s+(\d+)m$/i);
            if (hmMatch) {
                const hours = Number.parseInt(hmMatch[1], 10);
                const minutes = Number.parseInt(hmMatch[2], 10);
                return (Number.isFinite(hours) ? hours : 0) * 60 + (Number.isFinite(minutes) ? minutes : 0);
            }

            const mMatch = String(label || "").match(/^(\d+)m$/i);
            if (mMatch) {
                const minutes = Number.parseInt(mMatch[1], 10);
                return Number.isFinite(minutes) ? minutes : 0;
            }

            return 0;
        }

        function fillFilterOptions(movies) {
            const types = new Set();
            const genres = new Set();
            const years = new Set();
            const runtimes = new Set();
            const tags = new Set();

            for (const movie of movies) {
                const type = String(movie.Type || "").trim();
                if (type) {
                    types.add(type);
                }

                String(movie.Genre || "")
                    .split(",")
                    .map((g) => g.trim())
                    .filter(Boolean)
                    .forEach((g) => genres.add(g));

                if (movie.Year && movie.Year !== "N/A") {
                    years.add(String(movie.Year));
                }

                const runtimeBucket = runtimeBucketLabel(movie.Runtime);
                if (runtimeBucket) {
                    runtimes.add(runtimeBucket);
                }

                sanitizeTagList(movie.Tags).forEach((tag) => tags.add(tag));
            }

            const sortedTypes = [...types].sort((a, b) => a.localeCompare(b));
            const sortedGenres = [...genres].sort((a, b) => a.localeCompare(b));
            const sortedYears = [...years].sort((a, b) => Number(b) - Number(a));
            const sortedRuntimes = [...runtimes].sort((a, b) => {
                const aStart = parseRuntimeBucketLabelMinutes(a);
                const bStart = parseRuntimeBucketLabelMinutes(b);
                return bStart - aStart;
            });
            const sortedTags = [...tags].sort((a, b) => a.localeCompare(b));

            filterState.types = sortedTypes;
            filterState.genres = sortedGenres;
            filterState.years = sortedYears;
            filterState.runtimes = sortedRuntimes;
            filterState.tags = [TAG_FILTER_UNTAGGED, ...sortedTags];

            for (const value of [...filterState.selectedTypes]) {
                if (!filterState.types.includes(value)) {
                    filterState.selectedTypes.delete(value);
                }
            }

            for (const value of [...filterState.selectedGenres]) {
                if (!filterState.genres.includes(value)) {
                    filterState.selectedGenres.delete(value);
                }
            }

            for (const value of [...filterState.selectedYears]) {
                if (!filterState.years.includes(value)) {
                    filterState.selectedYears.delete(value);
                }
            }

            for (const value of [...filterState.selectedRuntimes]) {
                if (!filterState.runtimes.includes(value)) {
                    filterState.selectedRuntimes.delete(value);
                }
            }

            for (const value of [...filterState.selectedTags]) {
                if (!filterState.tags.includes(value)) {
                    filterState.selectedTags.delete(value);
                }
            }

            renderMultiOptions("type");
            renderMultiOptions("genre");
            renderMultiOptions("year");
            renderMultiOptions("runtime");
            renderMultiOptions("tag");
            updateMultiToggleLabels();
            fillLetterOptions(movies);
        }

        function applyFilters() {
            const query = normalize(refs.searchInput.value);
            const selectedTypes = [...filterState.selectedTypes];
            const selectedGenres = [...filterState.selectedGenres];
            const selectedYears = [...filterState.selectedYears];
            const selectedRuntimes = [...filterState.selectedRuntimes];
            const selectedTags = [...filterState.selectedTags];
            const sort = refs.sortSelect.value;

            let result = state.movies.filter((movie) => {
                const movieTags = sanitizeTagList(movie.Tags);
                const haystack = [movie.Title, movie.Actors, movie.Director, movie.Plot, movie.Genre, movieTags.join(" ")]
                    .map(normalize)
                    .join(" ");

                const matchesQuery = !query || haystack.includes(query);
                const movieType = String(movie.Type || "").trim();
                const movieGenres = String(movie.Genre || "").split(",").map((g) => g.trim()).filter(Boolean);
                const movieYear = String(movie.Year || "");
                const movieRuntimeBucket = runtimeBucketLabel(movie.Runtime);
                const matchesType = !selectedTypes.length || selectedTypes.includes(movieType);
                const matchesGenre = !selectedGenres.length || selectedGenres.some((genre) => movieGenres.includes(genre));
                const matchesYear = !selectedYears.length || selectedYears.includes(movieYear);
                const matchesRuntime = !selectedRuntimes.length || (movieRuntimeBucket && selectedRuntimes.includes(movieRuntimeBucket));
                const matchesTag =
                    !selectedTags.length ||
                    selectedTags.some((tag) => {
                        if (tag === TAG_FILTER_UNTAGGED) {
                            return movieTags.length === 0;
                        }
                        return movieTags.includes(tag);
                    });
                const selectedLetters = [...letterState.selectedLetters];
                const rawTitle = String(movie.Title || "").trim();
                let ignoreArticles = articlesState.ignore;
                let firstLetter = rawTitle[0]?.toUpperCase() || "";
                let effectiveLetter = firstLetter;
                if (ignoreArticles) {
                    // Always ignore A, An, The for filtering
                    const normalized = rawTitle.replace(/^(The|An|A)\s+/i, "").trim();
                    effectiveLetter = normalized[0]?.toUpperCase() || "";
                }
                let matchesLetter = false;
                if (!selectedLetters.length) {
                    matchesLetter = true;
                } else {
                    if (ignoreArticles) {
                        // Only match the effective letter (after ignoring articles)
                        if (selectedLetters.includes(effectiveLetter)) {
                            matchesLetter = true;
                        }
                    } else {
                        // When not ignoring articles, only match the first letter
                        if (selectedLetters.includes(firstLetter)) {
                            matchesLetter = true;
                        }
                    }
                }
                return matchesQuery && matchesType && matchesGenre && matchesYear && matchesRuntime && matchesTag && matchesLetter;
            });

            result = result.sort((a, b) => {
                function normalizeSortTitle(title) {
                    let t = String(title || "").trim().toLowerCase();
                    if (articlesState.ignore) {
                        if (t.startsWith("the ")) t = t.slice(4);
                        else if (t.startsWith("an ")) t = t.slice(3);
                        else if (t.startsWith("a ")) t = t.slice(2);
                    }
                    return t.trim();
                }
                if (sort === "title-asc") {
                    return normalizeSortTitle(a.Title).localeCompare(normalizeSortTitle(b.Title));
                }
                if (sort === "title-desc") {
                    return normalizeSortTitle(b.Title).localeCompare(normalizeSortTitle(a.Title));
                }
                if (sort === "year-desc") {
                    return Number(b.Year || 0) - Number(a.Year || 0);
                }
                if (sort === "year-asc") {
                    return Number(a.Year || 0) - Number(b.Year || 0);
                }
                if (sort === "rating-desc") {
                    return parseNumber(b.imdbRating) - parseNumber(a.imdbRating);
                }
                if (sort === "rating-asc") {
                    return parseNumber(a.imdbRating) - parseNumber(b.imdbRating);
                }
                if (sort === "votes-desc" || sort === "votes-asc") {
                    const getVotes = (m) => {
                        const raw = String(m.imdbVotes || "").replace(/,/g, "");
                        const n = Number.parseInt(raw, 10);
                        return Number.isFinite(n) ? n : 0;
                    };
                    const av = getVotes(a);
                    const bv = getVotes(b);
                    return sort === "votes-desc" ? bv - av : av - bv;
                }
                if (sort === "runtime-desc" || sort === "runtime-asc") {
                    const getRuntime = (m) => {
                        const match = String(m.Runtime || "").match(/(\d+)\s*min/i);
                        return match ? parseInt(match[1], 10) : 0;
                    };
                    const ar = getRuntime(a);
                    const br = getRuntime(b);
                    return sort === "runtime-desc" ? br - ar : ar - br;
                }
                return 0;
            });

            state.filtered = result;
            render();
        }

        function formatRuntime(runtimeStr) {
            if (!runtimeStr || runtimeStr === "N/A") return "Unknown runtime";
            const match = runtimeStr.match(/(\d+)\s*min/i);
            if (!match) return runtimeStr;
            const mins = parseInt(match[1], 10);
            if (!Number.isFinite(mins)) return runtimeStr;
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            let result = "";
            if (h > 0) result += `${h}h`;
            if (m > 0 || h === 0) result += `${h > 0 ? " " : ""}${m}m`;
            return result.trim();
        }

        function cardTemplate(movie) {
            // Global info visibility state
            const infoVisible = state.allInfoVisible !== false;
            const genres = String(movie.Genre || "")
                .split(",")
                .map((g) => g.trim())
                .filter(Boolean)
                .slice(0, 3)
                .map((g) => `<span class="rounded-full border border-[hsl(32_31%_78%)] bg-[hsl(35_53%_93%)] px-2.5 py-1 text-xs text-[hsl(29_17%_26%)] dark:border-[hsl(220_16%_33%)] dark:bg-[hsl(220_17%_23%)] dark:text-[hsl(40_30%_86%)]">${escapeHtml(g)}</span>`)
                .join("");

            const rating = movie.imdbRating && movie.imdbRating !== "N/A" ? movie.imdbRating : "-";
            const votesRaw = String(movie.imdbVotes || "").trim();
            const votesDigits = votesRaw.replace(/,/g, "");
            const hasVotes = /^\d+$/.test(votesDigits);
            const votes = hasVotes ? formatCompactCount(Number(votesDigits)) : "";
            const ratingWithVotes = hasVotes ? `${escapeHtml(rating)} (${escapeHtml(votes)})` : escapeHtml(rating);
            const runtime = formatRuntime(movie.Runtime);
            const year = movie.Year || "Unknown year";
            const title = escapeHtml(movie.Title || "Untitled");
            const fullPlot = escapeHtml(movie.Plot || "No plot available.");
            const plot = escapeHtml(truncateText(movie.Plot || "No plot available.", 95));
            const ratingTone = ratingToneClass(movie.imdbRating);
            const actorPills = String(movie.Actors || "")
                .split(",")
                .map((a) => a.trim())
                .filter(Boolean)
                .slice(0, 3)
                .map((a) => `<span class="shrink-0 rounded-full border border-[hsl(188_33%_74%)] bg-[hsl(189_54%_92%)] px-2.5 py-1 text-xs text-[hsl(191_37%_27%)] dark:border-[hsl(191_25%_34%)] dark:bg-[hsl(192_34%_24%)] dark:text-[hsl(187_39%_82%)]">${escapeHtml(a)}</span>`)
                .join("") || '<span class="text-[0.9rem] text-[hsl(28_10%_39%)] dark:text-[hsl(38_14%_70%)]">Actors unavailable</span>';
            const movieTags = sanitizeTagList(movie.Tags);
            const movieKey = escapeHtml(movie._movieKey || "");
            const tagPills = movieTags
                .map((tag) => `
                    <span class="inline-flex overflow-hidden rounded-full border border-[hsl(170_50%_55%)] bg-[hsl(166_72%_92%)] text-xs text-[hsl(164_70%_19%)] dark:border-[hsl(164_49%_48%)] dark:bg-[hsl(166_40%_23%)] dark:text-[hsl(162_71%_82%)]">
                        <span class="px-2.5 py-1">${escapeHtml(tag)}</span>
                        <button type="button" data-tag-remove="${movieKey}" data-tag-value="${escapeHtml(tag)}" class="inline-flex min-h-full items-center justify-center border-l border-[hsl(170_50%_55%_/_40%)] bg-[hsl(166_75%_86%)] px-2 text-[10px] leading-none text-[hsl(164_70%_19%)] hover:bg-[hsl(166_78%_80%)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[hsl(174_77%_26%/0.35)] dark:border-[hsl(164_49%_48%)] dark:bg-[hsl(166_39%_30%)] dark:text-[hsl(162_71%_82%)] dark:hover:bg-[hsl(166_39%_36%)]" title="Remove tag" aria-label="Remove tag ${escapeHtml(tag)}">x</button>
                    </span>
                `)
                .join("");
            const imdb = escapeHtml(movie.imdbID || "");
            const imdbIdRaw = String(movie.imdbID || "").trim();
            const imdbUrl = /^tt\d+$/.test(imdbIdRaw) ? `https://www.imdb.com/title/${imdbIdRaw}/` : "";
            const remotePoster = escapeHtml(movie.Poster || "");

            return `
                <article class="movie-card group flex min-h-full flex-col overflow-hidden rounded-xl border border-[hsl(32_32%_75%)] shadow-[0_8px_20px_hsl(32_58%_13%/0.12)] transform-gpu hover:scale-[1.01] hover:shadow-[0_14px_28px_hsl(32_58%_13%/0.22)] dark:border-[hsl(220_15%_27%)] dark:shadow-[0_8px_24px_hsl(220_45%_5%/0.5)] dark:hover:shadow-[0_14px_30px_hsl(220_48%_3%/0.72)]">
                    <img class="movie-poster aspect-[2/3] w-full object-cover bg-[hsl(37_43%_90%)] dark:bg-[hsl(220_15%_20%)]" loading="lazy" src="${posterPath(movie)}" alt="${title} poster" data-imdb="${imdb}" data-poster-url="${remotePoster}" data-step="0" onerror="handlePosterError(this)" />
                    <div class="movie-body flex flex-1 flex-col gap-2 bg-[hsl(40_100%_99%/0.68)] p-4 group-hover:bg-[hsl(40_100%_99%/0.96)] dark:bg-[hsl(220_14%_17%/0.9)] dark:group-hover:bg-[hsl(220_14%_21%/0.95)]" style="display:${infoVisible ? "flex" : "none"}">
                        <div class="movie-top-row flex flex-col gap-2">
                            <h2 class="movie-title m-0 text-[1.2rem] font-medium leading-6 text-[hsl(24_17%_10%)] dark:text-[hsl(43_33%_92%)]">${imdbUrl ? `<a href="${imdbUrl}" target="_blank" rel="noopener noreferrer" class="text-[hsl(208_72%_36%)] hover:text-[hsl(208_78%_30%)] hover:underline hover:underline-offset-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[hsl(208_72%_36%/0.35)] focus-visible:ring-offset-2 focus-visible:ring-offset-[hsl(40_100%_99%)] dark:text-[hsl(198_84%_71%)] dark:hover:text-[hsl(198_92%_80%)] dark:focus-visible:ring-[hsl(198_84%_71%/0.35)] dark:focus-visible:ring-offset-[hsl(220_14%_18%)]">${title}</a>` : title}</h2>
                            <div class="movie-meta flex flex-wrap items-center gap-x-3 gap-y-2 text-[0.95rem] leading-7 text-[hsl(29_13%_31%)] dark:text-[hsl(38_14%_74%)]">
                                <span>${escapeHtml(year)}</span>
                                <span aria-hidden="true">&middot;</span>
                                <span>${escapeHtml(runtime)}</span>
                                <span aria-hidden="true">&middot;</span>
                                <span class="${ratingTone}"><span style="font-size:1.1em;line-height:1;display:inline-block;">★</span> ${ratingWithVotes}</span>
                            </div>
                            <div class="movie-stars flex items-center gap-2" title="${escapeHtml(movie.Actors || "Actors unavailable")}">
                                <span class="shrink-0 text-[0.9rem] text-[hsl(29_13%_31%)] dark:text-[hsl(38_14%_74%)]">Stars:</span>
                                <div class="no-scrollbar flex min-w-0 flex-1 flex-nowrap items-center gap-2 overflow-x-auto whitespace-nowrap" style="-ms-overflow-style:none;scrollbar-width:none;">${actorPills}</div>
                            </div>
                            <div class="movie-genres flex flex-wrap gap-2 my-1">${genres}</div>
                        </div>
                        <p class="movie-plot movie-plot-grid m-0 text-[0.95rem] leading-[1.45] text-[hsl(30_14%_24%)] dark:text-[hsl(40_16%_82%)]" title="${fullPlot}" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">${plot}</p>
                        <p class="movie-plot movie-plot-list m-0 text-[0.95rem] leading-[1.45] text-[hsl(30_14%_24%)] dark:text-[hsl(40_16%_82%)]" title="${fullPlot}">${fullPlot}</p>
                        <div class="movie-tags mt-2 flex flex-wrap items-center gap-2 border-t border-[hsl(32_32%_75%_/_50%)] pt-3 dark:border-[hsl(220_15%_27%)]">
                            ${tagPills}
                            <span class="inline-flex h-8 overflow-hidden rounded-full border border-[hsl(34_33%_84%)] bg-[hsl(0_0%_100%)] dark:border-[hsl(220_16%_31%)] dark:bg-[hsl(220_16%_20%)]">
                                <input type="text" data-tag-input="${movieKey}" class="h-full w-20 bg-transparent px-3 text-xs text-[hsl(30_13%_10%)] outline-none ring-0 dark:text-[hsl(45_35%_93%)]" placeholder="Add tag" maxlength="32" />
                                <button type="button" data-tag-add="${movieKey}" class="inline-flex min-h-full items-center justify-center border-l border-[hsl(34_33%_84%)] bg-[hsl(36_33%_94%)] px-2.5 text-xs text-[hsl(30_13%_10%)] hover:bg-[hsl(36_37%_90%)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[hsl(174_77%_26%/0.35)] dark:border-[hsl(220_16%_31%)] dark:bg-[hsl(220_14%_26%)] dark:text-[hsl(45_35%_93%)] dark:hover:bg-[hsl(220_14%_30%)] dark:focus-visible:ring-[hsl(168_78%_42%/0.35)]" aria-label="Add tag">+</button>
                            </span>
                        </div>
                    </div>
                </article>
            `;
        }

        function render() {
            updateResultsCount();

            if (!state.filtered.length) {
                refs.grid.innerHTML = "";
                refs.emptyState.hidden = false;
                return;
            }

            refs.emptyState.hidden = true;
            refs.grid.innerHTML = state.filtered.map(cardTemplate).join("");

            // Wire up info toggle button in filters
            const infoToggle = document.getElementById("infoToggle");
            if (infoToggle) {
                infoToggle.textContent = state.allInfoVisible === false ? "Off" : "On";
                infoToggle.setAttribute("aria-pressed", String(state.allInfoVisible !== false));
                infoToggle.onclick = () => {
                    state.allInfoVisible = state.allInfoVisible === false ? true : false;
                    localStorage.setItem("info-visible", String(state.allInfoVisible));
                    render();
                };
            }
        }

        function addTagToMovie(movieKey, value) {
            const movie = getMovieByKey(movieKey);
            if (!movie) {
                return;
            }

            const tag = normalizeTag(value);
            if (!tag) {
                return;
            }

            const existing = sanitizeTagList(movie.Tags);
            if (existing.some((item) => item.toLowerCase() === tag.toLowerCase())) {
                return;
            }

            movie.Tags = [...existing, tag];
            fillFilterOptions(state.movies);
            applyFilters();
        }

        function parseTagArgs(argsLike) {
            const tags = [];
            for (const value of argsLike) {
                if (Array.isArray(value)) {
                    for (const nested of value) {
                        tags.push(nested);
                    }
                } else {
                    tags.push(value);
                }
            }
            return sanitizeTagList(tags);
        }

        function addTags(...tags) {
            const targetTags = parseTagArgs(tags);
            if (!targetTags.length) {
                return { updatedMovies: 0, addedTags: 0 };
            }

            let updatedMovies = 0;
            let addedTags = 0;

            for (const movie of state.filtered) {
                const existing = sanitizeTagList(movie.Tags);
                const existingLower = new Set(existing.map((tag) => tag.toLowerCase()));
                const merged = [...existing];
                let changed = false;

                for (const candidate of targetTags) {
                    const key = candidate.toLowerCase();
                    if (existingLower.has(key)) {
                        continue;
                    }
                    existingLower.add(key);
                    merged.push(candidate);
                    addedTags += 1;
                    changed = true;
                }

                if (changed) {
                    movie.Tags = merged;
                    updatedMovies += 1;
                }
            }

            if (updatedMovies > 0) {
                fillFilterOptions(state.movies);
                applyFilters();
            }

            return { updatedMovies, addedTags };
        }

        function removeTagFromMovie(movieKey, tagValue) {
            const movie = getMovieByKey(movieKey);
            if (!movie) {
                return;
            }

            const tag = normalizeTag(tagValue).toLowerCase();
            if (!tag) {
                return;
            }

            movie.Tags = sanitizeTagList(movie.Tags).filter((item) => item.toLowerCase() !== tag);
            fillFilterOptions(state.movies);
            applyFilters();
        }

        function removeTags(...tags) {
            const targetTags = parseTagArgs(tags).map((tag) => tag.toLowerCase());
            if (!targetTags.length) {
                return { updatedMovies: 0, removedTags: 0 };
            }

            const targetSet = new Set(targetTags);
            let updatedMovies = 0;
            let removedTags = 0;

            for (const movie of state.filtered) {
                const existing = sanitizeTagList(movie.Tags);
                const next = [];
                let changed = false;

                for (const tag of existing) {
                    if (targetSet.has(tag.toLowerCase())) {
                        removedTags += 1;
                        changed = true;
                        continue;
                    }
                    next.push(tag);
                }

                if (changed) {
                    movie.Tags = next;
                    updatedMovies += 1;
                }
            }

            if (updatedMovies > 0) {
                fillFilterOptions(state.movies);
                applyFilters();
            }

            return { updatedMovies, removedTags };
        }

        function focusTagInput(movieKey) {
            if (!movieKey) {
                return;
            }

            requestAnimationFrame(() => {
                const selector = `input[data-tag-input="${CSS.escape(movieKey)}"]`;
                const input = refs.grid.querySelector(selector);
                if (input instanceof HTMLInputElement) {
                    input.focus();
                }
            });
        }

        function wireTagEditors() {
            refs.grid.addEventListener("click", (event) => {
                const target = event.target;
                if (!(target instanceof Element)) {
                    return;
                }

                const removeButton = target.closest("button[data-tag-remove]");
                if (removeButton) {
                    removeTagFromMovie(removeButton.dataset.tagRemove || "", removeButton.dataset.tagValue || "");
                    return;
                }

                const addButton = target.closest("button[data-tag-add]");
                if (!addButton) {
                    return;
                }

                const movieKey = addButton.dataset.tagAdd || "";
                const input = refs.grid.querySelector(`input[data-tag-input="${CSS.escape(movieKey)}"]`);
                if (!input) {
                    return;
                }

                addTagToMovie(movieKey, input.value);
                input.value = "";
                focusTagInput(movieKey);
            });

            refs.grid.addEventListener("keydown", (event) => {
                const target = event.target;
                if (!(target instanceof HTMLInputElement)) {
                    return;
                }

                if (event.key !== "Enter") {
                    return;
                }

                const movieKey = target.dataset.tagInput || "";
                if (!movieKey) {
                    return;
                }

                event.preventDefault();
                addTagToMovie(movieKey, target.value);
                target.value = "";
                focusTagInput(movieKey);
            });
        }

        async function loadMovies() {
            const response = await fetch("movies.json", { cache: "no-store" });
            if (!response.ok) {
                throw new Error(`Failed to load movies.json: ${response.status}`);
            }

            const movies = await response.json();
            if (!Array.isArray(movies)) {
                throw new Error("movies.json must contain an array");
            }

            ensureMovieMeta(movies);
            state.movies = movies;
            fillFilterOptions(movies);
            applyFilters();
        }

        function wireEvents() {
            refs.searchInput.addEventListener("input", applyFilters);
            refs.sortSelect.addEventListener("change", applyFilters);
            // Wire up ignore articles checkbox
            const cb = document.getElementById("ignoreArticlesCheckbox");
            cb.checked = articlesState.ignore;
            cb.addEventListener("change", (e) => {
                articlesState.ignore = cb.checked;
                fillLetterOptions(state.movies);
                applyFilters();
            });

            refs.exportJsonButton.addEventListener("click", downloadEditedMovies);
        }

        async function init() {
            wireTheme();
            wireControlsToggle();
            wireGridWidthToggle();
            wireCardViewToggle();
            wireMultiSelectControls();
            wireLetterMultiSelectControl();
            wireTagEditors();
            wireEvents();
            window.addTags = addTags;
            window.removeTags = removeTags;
            try {
                await loadMovies();
            } catch (error) {
                refs.emptyState.hidden = false;
                refs.emptyState.textContent = error.message;
            }
        }

        init();
    </script>
</body>
</html>
